 advanced_torture_result_skull_crusher_01_desc:0 "碎颅器以可怕的精确套上[advanced_torture_prisoner.GetShortUIName]的头。机关缓慢转动，每一下都让整个世界收缩成一个痛点。"
 advanced_torture_result_skull_crusher_02_desc:0 "狱卒并不急躁。压力升高，抹去辱骂，再抹去言语，最后几乎抹去[advanced_torture_prisoner.GetShortUIName]的意识。"
 advanced_torture_result_skull_crusher_03_desc:0 "铁、螺杆和耐心已经足够。[advanced_torture_prisoner.GetShortUIName]很快明白，头颅里能容纳的恐惧比思绪更多。"
