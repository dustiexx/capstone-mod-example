 advanced_torture_result_enucleation_01_desc:0 "刑具靠近[advanced_torture_prisoner.GetShortUIName]的脸，牢房里再没有人会把威胁与命令混淆。当眼睛被挖出，痛楚之后留下的是无法遮掩的残缺。"
 advanced_torture_result_enucleation_02_desc:0 "[advanced_torture_prisoner.GetShortUIName]被死死按住，狱卒以残忍的缓慢动作执行。短促的一声惨叫之后，世界永远变暗了一半。"
 advanced_torture_result_enucleation_03_desc:0 "你的命令毫无仪式地完成。[advanced_torture_prisoner.GetShortUIName]也许会活下来，但每一道失去的目光都会记得是谁判下此刑。"
 advanced_torture_result_leg_amputation_01_desc:0 "皮带勒住[advanced_torture_prisoner.GetShortUIName]，刑具随之落下。那条腿被献给惩罚，地牢里充满血、铁和恐惧。"
 advanced_torture_result_leg_amputation_02_desc:0 "不再是威胁，而是一项决定。当狱卒结束工作，[advanced_torture_prisoner.GetShortUIName]明白痛楚会比缺失更早过去。"
 advanced_torture_result_leg_amputation_03_desc:0 "残缺已经完成。[advanced_torture_prisoner.GetShortUIName]仍在呼吸，但身体从此有了无法回头的界线。"
 advanced_torture_result_nail_cleaner_01_desc:0 "在地牢昏暗的光下，[advanced_torture_prisoner.GetShortUIName]承受了拔甲针。狱卒以冰冷而熟练的手法行事，让痛苦缓慢上升，足以让每一刻都被理解并畏惧。"
 advanced_torture_result_nail_cleaner_02_desc:0 "目的并不只是伤害[advanced_torture_prisoner.GetShortUIName]，而是把服从刻进记忆。拔甲针把惨叫变成破碎的沉默，又把沉默变成可能的供认。"
 advanced_torture_result_nail_cleaner_03_desc:0 "当折磨结束时，[advanced_torture_prisoner.GetShortUIName]已不再完全是原来的样子。石墙保存着痛苦的回声，身体则带着嘴唇不敢诉说的东西。"
 advanced_torture_result_phalaris_bull_01_desc:0 "铜牛吞下[advanced_torture_prisoner.GetShortUIName]，周围火盆被拨旺。热量把金属变成判决，从里面传出的惨叫仿佛来自一头野兽。"
 advanced_torture_result_phalaris_bull_02_desc:0 "青铜门合上时，牢房屏住呼吸。随后火焰开口，缓慢地说话，直到[advanced_torture_prisoner.GetShortUIName]只剩被困在金属里的声音。"
 advanced_torture_result_phalaris_bull_03_desc:0 "法拉里斯铜牛不只是焚烧，它给恐惧一个形状。[advanced_torture_prisoner.GetShortUIName]消失在热浪中，地牢静静聆听。"
