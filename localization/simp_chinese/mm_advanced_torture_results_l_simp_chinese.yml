l_simp_chinese:
 advanced_torture.1001.t:0 "酷刑结束"
 advanced_torture.1001.desc:0 "折磨结束了。[advanced_torture_prisoner.GetShortUIName]沉默下来，因痛苦而虚弱，因恐惧而留下印记。"
 advanced_torture.1001.a:0 "让这堂课被记住。"
 advanced_torture.1002.t:0 "烙印已成"
 advanced_torture.1002.desc:0 "烙铁留下了标记。即使疼痛褪去很久之后，[advanced_torture_prisoner.GetShortUIName]仍会带着你惩罚的痕迹。"
 advanced_torture.1002.a:0 "一个烙印胜过千句威胁。"
 advanced_torture.1004.t:0 "一只眼被夺走"
 advanced_torture.1004.desc:0 "[advanced_torture_prisoner.GetShortUIName]在你的命令下失去了一只眼。疼痛终会过去，残缺却会留下。"
 advanced_torture.1004.a:0 "让其看得更少，却记得更多。"
 advanced_torture.1007.t:0 "身体被击碎"
 advanced_torture.1007.desc:0 "酷刑让[advanced_torture_prisoner.GetShortUIName]留下破碎的身体和衰弱的意志。"
 advanced_torture.1007.a:0 "身体也会服从。"
 advanced_torture.1008.t:0 "酷刑以死亡告终"
 advanced_torture.1008.desc:0 "[advanced_torture_prisoner.GetShortUIName]的身体没能承受住折磨。在伤口、疲惫与恐惧之间，生命在任何人来得及阻止前滑走。"
 advanced_torture.1008.a:0 "其抵抗到此为止。"
 advanced_torture_result_simple_whipping_01_desc:0 "在地牢昏暗的光下，[advanced_torture_prisoner.GetShortUIName]承受了鞭笞。狱卒以冰冷而熟练的手法行事，让痛苦缓慢上升，足以让每一刻都被理解并畏惧。"
 advanced_torture_result_simple_whipping_02_desc:0 "目的并不只是伤害[advanced_torture_prisoner.GetShortUIName]，而是把服从刻进记忆。鞭笞把惨叫变成破碎的沉默，又把沉默变成可能的供认。"
 advanced_torture_result_simple_whipping_03_desc:0 "当折磨结束时，[advanced_torture_prisoner.GetShortUIName]已不再完全是原来的样子。石墙保存着痛苦的回声，身体则带着嘴唇不敢诉说的东西。"
