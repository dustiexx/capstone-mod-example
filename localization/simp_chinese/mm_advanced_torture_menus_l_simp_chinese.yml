l_simp_chinese:
 advanced_torture.0001.t:0 "高级酷刑"
 advanced_torture.0001.desc:0 "[advanced_torture_prisoner.GetShortUIName]任由你处置。牢房冰冷、潮湿而寂静，只有锁链声与囚犯颤抖的呼吸打破沉默。你可以下令施以轻罚，转向更严酷的手段，开始漫长折磨，或开启只属于真正冷酷者的刑罚。"
 advanced_torture.0001.light:0 "轻度酷刑"
 advanced_torture.0001.medium:0 "中度酷刑"
 advanced_torture.0001.strong:0 "重度酷刑"
 advanced_torture.0001.long_tortures:0 "长期酷刑"
 advanced_torture.0001.unique:0 "独特酷刑"
 advanced_torture.0001.cancel:0 "不值得如此"
 advanced_torture.0002.t:0 "轻度酷刑"
 advanced_torture.0002.desc:0 "并非每种酷刑都要毁掉肉体。有些只需羞辱、烙印，或折断囚犯的尊严，而不必把牢房变成屠宰场。"
 advanced_torture.0002.simple_whipping:0 "鞭笞"
 advanced_torture.0002.branding_iron:0 "烙铁"
 advanced_torture.0002.stocks:0 "足枷"
 advanced_torture.0002.walk_of_shame:0 "耻辱游行"
 advanced_torture.0003.t:0 "中度酷刑"
 advanced_torture.0003.desc:0 "这些方法已不再是简单惩戒。它们用来击碎抵抗、逼供认罪，并让囚犯永远记住你的权威能造成怎样的痛苦。"
 advanced_torture.0003.bastinado:0 "足底杖刑 / Falaka"
 advanced_torture.0003.water_torment:0 "水刑 / Toca"
 advanced_torture.0003.compression_cords:0 "绞压细绳"
 advanced_torture.0003.strappado:0 "吊臂刑"
 advanced_torture.0003.thumbscrew:0 "拇指夹"
 advanced_torture.0003.short_stretching_bench:0 "短式拉伸刑架"
 advanced_torture.0004.t:0 "重度酷刑"
 advanced_torture.0004.desc:0 "警告到此为止，持久的伤残由此开始。这些酷刑会留下破碎的身体、废掉的肢体、失去的眼睛，以及任何医师都无法抹去的记忆。"
 advanced_torture.0004.rack:0 "拉肢刑架"
 advanced_torture.0004.wedged_boot:0 "楔靴刑"
 advanced_torture.0004.rats:0 "鼠刑"
 advanced_torture.0004.enucleation:0 "挖出一只眼"
 advanced_torture.0004.leg_amputation:0 "截腿"
 advanced_torture.0004.nail_cleaner:0 "拔甲针 / 金属锥"
 advanced_torture.0005.t:0 "独特酷刑"
 advanced_torture.0005.desc:0 "有些折磨并不属于任何普通类别。它们来自特定文化、黑暗传统、特殊兼容补丁，或来自那些早已越过寻常残忍界限的人。"
 advanced_torture.0005.sadistic:0 "施虐酷刑"
 advanced_torture.0005.cultural:0 "文化酷刑"
 advanced_torture.0006.t:0 "施虐酷刑"
 advanced_torture.0006.desc:0 "这些手段不只是惩罚。它们是冷酷的残忍展示，只属于那些能从痛苦中获得满足的人。"
 advanced_torture.0006.phalaris_bull:0 "法拉里斯铜牛"
 advanced_torture.0006.judas_cradle:0 "犹大摇篮"
 advanced_torture.0006.pear_of_anguish:0 "痛苦梨"
 advanced_torture.0006.iron_spider:0 "铁蜘蛛"
 advanced_torture.0006.torture_chair:0 "刑椅"
 advanced_torture.0006.skull_crusher:0 "碎颅器"
 advanced_torture.0007.t:0 "文化酷刑"
 advanced_torture.0007.desc:0 "这一部分保留给特定文化与传统的折磨方式。以后可以在不触动核心系统的情况下继续扩展。"
 advanced_torture.0007.empty:0 "目前没有可用的文化酷刑。"
