l_simp_chinese:
 advanced_torture.2001.t:0 "施刑者"
 advanced_torture.2001.desc:0 "你已经学会把痛苦变成服从。地牢在你经过时，已经低声念出一个新的名号。"
 advanced_torture.2001.a:0 "让他们低声说出这个名字。"
 advanced_torture.2002.t:0 "夺眼者"
 advanced_torture.2002.desc:0 "不止一名囚犯在你的命令下失去了视力。如今，有些人在你开口之前就会移开目光。"
 advanced_torture.2002.a:0 "让他们害怕我的注视。"
 advanced_torture.2003.t:0 "碎骨者"
 advanced_torture.2003.desc:0 "骨头碎裂的声音成了你的印记。敌人知道，你的耐心比他们的身体更持久。"
 advanced_torture.2003.a:0 "骨头会记得。"
 advanced_torture.2004.t:0 "毁容者"
 advanced_torture.2004.desc:0 "昔日高贵的面孔如今带着你的警告。每一道伤痕都在宫廷中诉说你的怒火代价。"
 advanced_torture.2004.a:0 "让他们把我的讯息刻在皮肤上。"
 advanced_torture.2005.t:0 "残肢者"
 advanced_torture.2005.desc:0 "失去的肢体、破碎的身体和颤抖的幸存者构成了你的名声。那里几乎没有怜悯的位置。"
 advanced_torture.2005.a:0 "身体仍可成为例子。"
 advanced_torture.2006.t:0 "致盲者"
 advanced_torture.2006.desc:0 "光明已经离开那些胆敢反抗你的眼睛。在他们如今携带的黑暗中，你的名字仍然存在。"
 advanced_torture.2006.a:0 "他们看得更少，却记得更多。"
 advanced_torture.2007.t:0 "耐心折磨者"
 advanced_torture.2007.desc:0 "你从不急躁。你让恐惧成熟，让力量耗尽，让意志缓慢裂开。"
 advanced_torture.2007.a:0 "耐心也是刑具。"
 advanced_torture.2008.t:0 "猩红审问者"
 advanced_torture.2008.desc:0 "你的问题很少长久得不到回答。鲜血与恐惧懂得撬开最坚固的沉默。"
 advanced_torture.2008.a:0 "真相有代价。"
 advanced_torture.2009.t:0 "红手"
 advanced_torture.2009.desc:0 "你的手已成为惩罚的象征。它落到哪里，恐惧很快就会跟随。"
 advanced_torture.2009.a:0 "一只手就足够。"
 advanced_torture.2010.t:0 "真相破坏者"
 advanced_torture.2010.desc:0 "你寻找的不只是秘密；你击碎保护秘密的抵抗。连谎言也会在你面前发抖。"
 advanced_torture.2010.a:0 "一切终会屈服。"
 advanced_torture.2011.t:0 "牢房屠夫"
 advanced_torture.2011.desc:0 "地牢有自己的语言：锁链、潮湿的石头、缓慢的脚步，以及久久不散的惨叫。在这种语言里，你的名字意味着屠宰。"
 advanced_torture.2011.a:0 "我的牢房会教会服从。"
 nick_advanced_torture_the_torturer:0 "施刑者"
 nick_advanced_torture_the_eye_taker:0 "夺眼者"
 nick_advanced_torture_the_bone_breaker:0 "碎骨者"
 nick_advanced_torture_the_disfigurer:0 "毁容者"
 nick_advanced_torture_the_maimer:0 "残肢者"
 nick_advanced_torture_the_blinder:0 "致盲者"
 nick_advanced_torture_the_patient_tormentor:0 "耐心折磨者"
 nick_advanced_torture_the_crimson_questioner:0 "猩红审问者"
 nick_advanced_torture_the_red_hand:0 "红手"
 nick_advanced_torture_the_truthbreaker:0 "真相破坏者"
 nick_advanced_torture_the_butcher_of_cells:0 "牢房屠夫"
