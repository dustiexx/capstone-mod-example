 advanced_torture_light_torture_tt:0 "轻度酷刑。它造成轻微伤害、羞辱与怨恨，但很少留下永久后果。"
 advanced_torture_medium_torture_tt:0 "中度酷刑。它可能造成伤口、身体衰败、持久恐惧，并更容易逼出秘密。"
 advanced_torture_strong_torture_tt:0 "重度酷刑。它可能留下严重后果、残缺、疾病、精神损伤，甚至意外死亡。"
 advanced_torture_sadistic_torture_tt:0 "施虐酷刑。只有极端残忍之人才会毫不犹豫地下令施行。"
 advanced_torture_enucleation_tt:0 "挖出囚犯的一只眼睛。不能对已经失明的角色使用。"
 advanced_torture_leg_amputation_tt:0 "截去囚犯的一条腿。不能对已经失去一条腿的角色使用。"
 advanced_torture_tortured_to_survive:0 "为受刑而苟活"
 advanced_torture_tortured_to_survive_desc:0 "这名囚犯被经验丰富的施刑者维持在死亡边缘；这不是仁慈，而是为了延长痛苦。"
