l_simp_chinese:
 advanced_torture_interaction:0 "高级酷刑"
 advanced_torture_interaction_desc:0 "通过高级酷刑菜单，对[recipient.GetShortUINameNoTooltip]施加选定的折磨。"
 advanced_torture_cooldown:0 "近期受刑"
 advanced_torture_cooldown_desc:0 "该角色近期已遭受酷刑，暂时不能再次接受高级酷刑。"
 advanced_torture_recently_tortured:0 "近期受刑"
 advanced_torture_recently_tortured_desc:0 "该角色刚刚遭受过酷刑。痛楚、恐惧与伤口仍沉重地压在身心之上。"
 advanced_torture_recovery_minor:0 "从轻度酷刑中恢复"
 advanced_torture_recovery_minor_desc:0 "该角色正在从轻微折磨中恢复。痕迹清晰可见，但伤害似乎尚未不可逆转。"
 advanced_torture_recovery_medium:0 "从中度酷刑中恢复"
 advanced_torture_recovery_medium_desc:0 "该角色正在从严酷的折磨中恢复。身体仍然虚弱，精神也记得那场 折磨。"
 advanced_torture_recovery_severe:0 "从重度酷刑中恢复"
 advanced_torture_recovery_severe_desc:0 "该角色承受了残酷酷刑的后果。伤口、恐惧与屈辱都留下了深刻印记。"
 advanced_torture_tortured_me_opinion:0 "折磨过我"
