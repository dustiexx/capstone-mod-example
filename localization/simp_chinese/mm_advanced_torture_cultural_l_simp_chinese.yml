 advanced_torture.cultural.drakkar_stocks: "龙船枷具"
 advanced_torture.scene.cultural.drakkar_stocks.t: "龙船枷具"
 advanced_torture.scene.cultural.drakkar_stocks.desc: "他们为[advanced_torture_prisoner.GetTitledFirstName]准备龙船枷具。这不是处决，而是一种带有鲜明文化印记的酷刑：每件刑具都被有意摆放，将压迫、疼痛与公开羞辱化为在场者一眼便能认出的传统惩罚。"
 advanced_torture_result_cultural_drakkar_stocks_01_desc: "龙船枷具使[advanced_torture_prisoner.GetTitledFirstName]浑身颤抖，尊严被一种在场者都认得出的民族刑法击碎。"
 advanced_torture_result_cultural_drakkar_stocks_02_desc: "龙船枷具结束时，室内的沉默仿佛比伤口更沉重。[advanced_torture_prisoner.GetTitledFirstName]明白了，痛苦也能说出一种文化的语言。"
 advanced_torture_result_cultural_drakkar_stocks_03_desc: "龙船枷具的刑具被冷静地撤走。痕迹仍在，呼吸发颤，而羞辱已经被精心仪式化。"
