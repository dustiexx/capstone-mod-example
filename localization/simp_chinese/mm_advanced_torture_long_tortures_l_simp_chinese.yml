l_simp_chinese:
 advanced_torture_long_sleep_3_tt:0 "你将开始三天的睡眠剥夺。囚犯会筋疲力尽，也许在结束前就会崩溃。"
 advanced_torture_long_sleep_5_tt:0 "你将开始五天的睡眠剥夺。精神与身体受损的风险会更高。"
 advanced_torture_long_sleep_7_tt:0 "你将开始七天的睡眠剥夺。后果可能十分严重，死亡也不再遥远。"
 advanced_torture_long_sleep_10_tt:0 "你将开始十天的睡眠剥夺。囚犯可能彻底崩溃，甚至无法活下来。"
 advanced_torture_long_dark_cell_15_tt:0 "你将把囚犯关入黑牢十五天。孤立可能击垮其意志。"
 advanced_torture_long_dark_cell_30_tt:0 "你将把囚犯关入黑牢三十天。孤立可能逼出哀求或秘密。"
 advanced_torture_long_dark_cell_60_tt:0 "你将把囚犯关入黑牢六十天。精神伤害会非常严重。"
 advanced_torture_long_dark_cell_90_tt:0 "你将把囚犯关入黑牢九十天。黑暗可能让其疾病缠身、神志混乱，并留下难以抹去的创伤。"
 advanced_torture_long_starvation_5_tt:0 "你将剥夺囚犯足够的食物与水五天。其身体会开始衰弱。"
 advanced_torture_long_starvation_15_tt:0 "你将剥夺囚犯足够的食物与水十五天。饥渴会同时击垮身体与意志。"
 advanced_torture_long_starvation_30_tt:0 "你将剥夺囚犯足够的食物与水三十天。后果可能变成永久伤害。"
 advanced_torture_long_starvation_50_tt:0 "你将剥夺囚犯足够的食物与水五十天。能否存活将难以确定，伤害也会极端严重。"
 advanced_torture_long_suspension_1_tt:0 "你将吊起囚犯一天。痛苦会很强烈，但仍可控制。"
 advanced_torture_long_suspension_3_tt:0 "你将吊起囚犯三天。其四肢会开始承受不住。"
 advanced_torture_long_suspension_5_tt:0 "你将吊起囚犯五天。肉体损伤可能非常严重。"
 advanced_torture_long_suspension_7_tt:0 "你将吊起囚犯七天。这种酷刑可能彻底毁掉其身体。"
 advanced_torture.6001.t:0 "长期酷刑"
 advanced_torture.6001.desc:0 "并非所有折磨都会在一次刑讯中结束。有些需要数日的囚禁、等待、疲惫与恐惧。囚犯承受的不仅是当下的痛楚，还有不知道何时结束的不确定。"
 advanced_torture.6001.sleep_deprivation:0 "睡眠剥夺"
 advanced_torture.6001.dark_cell:0 "黑牢"
 advanced_torture.6001.starvation:0 "饥饿与干渴"
 advanced_torture.6001.prolonged_suspension:0 "长期悬吊"
 advanced_torture.6002.t:0 "睡眠剥夺"
 advanced_torture.6002.desc:0 "睡眠剥夺不需要刀刃或火盆。灯光、噪声、质问、黑暗中的脚步，以及每当身体想要沉入睡眠时将其惊醒的手，已经足够。选择这场守夜要持续多久。"
 advanced_torture.6002.three_days:0 "三天"
 advanced_torture.6002.five_days:0 "五天"
 advanced_torture.6002.seven_days:0 "七天"
 advanced_torture.6002.ten_days:0 "十天"
 advanced_torture.6003.t:0 "黑牢"
 advanced_torture.6003.desc:0 "黑牢并不一次性惩罚人。它用缺失来惩罚：没有光，没有清晰的声音，也无法确定日子是否流逝。在里面，哪怕一小段沉默都像威胁。"
 advanced_torture.6003.fifteen_days:0 "十五天"
 advanced_torture.6003.thirty_days:0 "三十天"
 advanced_torture.6003.sixty_days:0 "六十天"
 advanced_torture.6003.ninety_days:0 "九十天"
 advanced_torture.6004.t:0 "饥饿与干渴"
 advanced_torture.6004.desc:0 "饥饿一开始并不会尖叫。它慢慢沉下去，收紧腹部，烘干口腔，把每一种气味、每一只水罐和每一次被拿走的托盘都变成残忍的承诺。"
 advanced_torture.6004.five_days:0 "五天"
 advanced_torture.6004.fifteen_days:0 "十五天"
 advanced_torture.6004.thirty_days:0 "三十天"
 advanced_torture.6004.fifty_days:0 "五十天"
 advanced_torture.6005.t:0 "长期悬吊"
 advanced_torture.6005.desc:0 "绳索不断收紧，直到双脚几乎触不到地面，甚至完全离地。最先疼的是身体。随后是肩膀、呼吸、神经、等待，以及除非你下令否则无人会放下他的确信。"
 advanced_torture.6005.one_day:0 "一天"
 advanced_torture.6005.three_days:0 "三天"
 advanced_torture.6005.five_days:0 "五天"
 advanced_torture.6005.seven_days:0 "七天"
 advanced_torture.6201.t:0 "失眠结束"
 advanced_torture.6201.desc:0 "经历数日没有真正休息之后，[advanced_torture_prisoner.GetShortUIName]几乎无法稳住目光。回答总是迟钝，双手颤抖，每一次眨眼都像一次失败。身体还活着，精神却已被拖到崩溃边缘。"
 advanced_torture.6201.a:0 "让其睡吧，若还睡得着。"
 advanced_torture.6202.t:0 "牢门开启"
 advanced_torture.6202.desc:0 "当门再次打开，[advanced_torture_prisoner.GetShortUIName]从黑暗中走出，身体虚弱，意志磨损。光线像控诉般刺痛其眼睛，一时间他似乎分不清自由、惩罚与梦境。"
 advanced_torture.6202.a:0 "黑暗会教会服从。"
 advanced_torture.6203.t:0 "饥饿与干渴"
 advanced_torture.6203.desc:0 "数日的剥夺已经把[advanced_torture_prisoner.GetShortUIName]削成疲惫的影子。饥渴没有留下干净的伤口，却留下了难以忘记的虚弱。"
 advanced_torture.6203.a:0 "需求也可以成为锁链。"
 advanced_torture.6204.t:0 "悬吊结束"
 advanced_torture.6204.desc:0 "长期悬吊终于结束。[advanced_torture_prisoner.GetShortUIName]带着受损的身体、颤抖的四肢和无需言语的表情坠落下来。"
 advanced_torture.6204.a:0 "让其记住每一刻。"
 advanced_torture.6301.t:0 "被清醒击垮"
 advanced_torture.6301.desc:0 "[advanced_torture_prisoner.GetShortUIName]已经分不清是在和你、狱卒还是墙上移动的影子说话。无意义的句子与破碎的哀求之间，名字、恐惧和半真半假的秘密纷纷漏出。他还能继续承受，但内里已有某物断裂。"
 advanced_torture.6301.release:0 "结束守夜"
 advanced_torture.6301.continue:0 "继续下去"
 advanced_torture.6301.extend:0 "延长守夜"
 advanced_torture.6302.t:0 "黑暗中的声音"
 advanced_torture.6302.desc:0 "在黑牢里，[advanced_torture_prisoner.GetShortUIName]开始与不存在的人说话。门打开时，词语乱成一团：祈祷、供认、秘密碎片，以及对沉默本身的指控。孤立已经完成了它的工作。"
 advanced_torture.6302.release:0 "打开牢门"
 advanced_torture.6302.continue:0 "重新关上"
 advanced_torture.6302.extend:0 "延长孤立"
 advanced_torture.6303.t:0 "饥饿开口"
 advanced_torture.6303.desc:0 "[advanced_torture_prisoner.GetShortUIName]只看见一只碗就开始发抖。干裂的嘴唇先于骄傲寻找语言，饥饿把真相从干涸的喉咙里推出来。身体甚至比精神更早求饶。"
 advanced_torture.6303.release:0 "给其足以活命的食水"
 advanced_torture.6303.continue:0 "让饥饿继续说话"
 advanced_torture.6303.extend:0 "延长剥夺"
 advanced_torture.6304.t:0 "四肢开始屈服"
 advanced_torture.6304.desc:0 "悬吊把时间变成了一道持续的伤。[advanced_torture_prisoner.GetShortUIName]不再有力气尖叫，只会呻吟、颤抖并失去对时辰的计数。每一条绳索都像学会了痛苦的语言。"
 advanced_torture.6304.release:0 "把其放下来"
 advanced_torture.6304.continue:0 "继续吊着"
 advanced_torture.6304.extend:0 "延长悬吊"
 advanced_torture.6401.t:0 "守夜开始"
 advanced_torture.6401.desc:0 "狱卒奉命不得让[advanced_torture_prisoner.GetShortUIName]合眼。火把会持续燃烧，脚步会在走廊中回响；每当身体试图睡去，一只粗暴的手便会将其拖回清醒。"
 advanced_torture.6401.a:0 "不许休息。"
 advanced_torture.6402.t:0 "黑牢"
 advanced_torture.6402.desc:0 "[advanced_torture_prisoner.GetShortUIName]被带过人声渐远的走廊，直到一间光线尚未落地便已死去的房间。门合上了。门后，时间不再有形状。"
 advanced_torture.6402.a:0 "让黑暗完成它的工作。"
 advanced_torture.6403.t:0 "强迫禁食"
 advanced_torture.6403.desc:0 "守卫奉命控制每一份口粮、每一口水、每一次被撤走的托盘。[advanced_torture_prisoner.GetShortUIName]不会立刻死去；饥饿会先替他数清每一个时辰。"
 advanced_torture.6403.a:0 "让需求驯服他。"
 advanced_torture.6404.t:0 "悬吊开始"
 advanced_torture.6404.desc:0 "绳结打牢，手腕勒紧，[advanced_torture_prisoner.GetShortUIName]被吊起，直到自身重量成为刑具。狱卒接下来只需等待。"
 advanced_torture.6404.a:0 "让其挂在那里。"
