l_spanish:
 advanced_torture.0001.t:0 "Tortura avanzada"
 advanced_torture.0001.desc:0 "[advanced_torture_prisoner.GetShortUIName] está a tu merced. La celda es fría, húmeda y silenciosa, salvo por el ruido de las cadenas y la respiración temblorosa del prisionero. Puedes ordenar un castigo leve, recurrir a métodos más crueles, iniciar una tortura prolongada o abrir la puerta a tormentos reservados para los verdaderamente despiadados."
 advanced_torture.0001.light:0 "Torturas leves"
 advanced_torture.0001.medium:0 "Torturas medias"
 advanced_torture.0001.strong:0 "Torturas fuertes"
 advanced_torture.0001.long_tortures:0 "Torturas prolongadas"
 advanced_torture.0001.unique:0 "Torturas únicas"
 advanced_torture.0001.cancel:0 "No merece la pena"

 advanced_torture.0002.t:0 "Torturas leves"
 advanced_torture.0002.desc:0 "No toda tortura busca destruir el cuerpo. Algunas solo necesitan humillar, marcar o quebrar la dignidad del prisionero sin convertir la celda en un matadero."
 advanced_torture.0002.simple_whipping:0 "Azotes"
 advanced_torture.0002.branding_iron:0 "Marca con hierro candente"
 advanced_torture.0002.stocks:0 "Cepo de pies"
 advanced_torture.0002.walk_of_shame:0 "Paseo de vergüenza"

 advanced_torture.0003.t:0 "Torturas medias"
 advanced_torture.0003.desc:0 "Estos métodos ya no son simples castigos. Están diseñados para romper la resistencia, arrancar confesiones y dejar al prisionero con un recuerdo imborrable del dolor que puede causar tu autoridad."
 advanced_torture.0003.bastinado:0 "Bastinado / Falaka"
 advanced_torture.0003.water_torment:0 "Tormento del agua / Toca"
 advanced_torture.0003.compression_cords:0 "Cordeles de compresión"
 advanced_torture.0003.strappado:0 "Garrucha / Strappado"
 advanced_torture.0003.thumbscrew:0 "Aplastapulgares"
 advanced_torture.0003.short_stretching_bench:0 "Banco de estiramiento corto"

 advanced_torture.0004.t:0 "Torturas fuertes"
 advanced_torture.0004.desc:0 "Aquí terminan las advertencias y empiezan las heridas duraderas. Estos tormentos dejan cuerpos rotos, miembros inútiles, ojos perdidos y recuerdos que ningún sanador puede borrar."
 advanced_torture.0004.rack:0 "Potro de tensión"
 advanced_torture.0004.wedged_boot:0 "Bota de cuñas"
 advanced_torture.0004.rats:0 "Suplicio de las ratas"
 advanced_torture.0004.enucleation:0 "Enucleación de un ojo"
 advanced_torture.0004.leg_amputation:0 "Amputación de pierna"
 advanced_torture.0004.nail_cleaner:0 "Limpiador de uñas / Estiletes"

 advanced_torture.0005.t:0 "Torturas únicas"
 advanced_torture.0005.desc:0 "Algunos tormentos no encajan en ninguna categoría ordinaria. Pertenecen a culturas concretas, tradiciones oscuras, compatibilidades especiales o a quienes ya han cruzado el límite de la crueldad común."
 advanced_torture.0005.sadistic:0 "Torturas sádicas"
 advanced_torture.0005.cultural:0 "Torturas culturales"

 advanced_torture.0006.t:0 "Torturas sádicas"
 advanced_torture.0006.desc:0 "Estos métodos no son justicia, disciplina ni interrogatorio común. Son actos de crueldad excepcional reservados para quienes encuentran placer en el sufrimiento ajeno."
 advanced_torture.0006.phalaris_bull:0 "Toro de Falaris"
 advanced_torture.0006.judas_cradle:0 "Cuna de Judas"
 advanced_torture.0006.pear_of_anguish:0 "Pera de la Angustia"
 advanced_torture.0006.iron_spider:0 "Araña de Hierro"
 advanced_torture.0006.torture_chair:0 "Silla de Tortura / Silla de Clavos"
 advanced_torture.0006.skull_crusher:0 "Aplastador de cráneos"

 advanced_torture.0007.t:0 "Torturas culturales"
 advanced_torture.0007.desc:0 "Las torturas culturales quedan reservadas para una fase posterior. Por ahora, las mazmorras aún no han preparado estos métodos."
 advanced_torture.0007.empty:0 "No hay torturas culturales disponibles por ahora"