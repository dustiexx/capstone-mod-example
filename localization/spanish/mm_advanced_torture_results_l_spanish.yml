l_spanish:
 advanced_torture.1001.t:0 "La tortura termina"
 advanced_torture.1001.desc:0 "El tormento ha terminado. [advanced_torture_prisoner.GetShortUIName] queda en silencio, debilitado por el dolor y marcado por el miedo."
 advanced_torture.1001.a:0 "Que recuerde esta lección."

 advanced_torture.1002.t:0 "La marca queda hecha"
 advanced_torture.1002.desc:0 "El hierro ha dejado su señal. [advanced_torture_prisoner.GetShortUIName] llevará la marca de tu castigo mucho después de que el dolor se apague."
 advanced_torture.1002.a:0 "Una marca habla más que mil amenazas."

 advanced_torture.1004.t:0 "Un ojo menos"
 advanced_torture.1004.desc:0 "[advanced_torture_prisoner.GetShortUIName] ha perdido un ojo bajo tus órdenes. El dolor pasará, pero la mutilación permanecerá."
 advanced_torture.1004.a:0 "Que vea menos, pero recuerde más."

 advanced_torture.1007.t:0 "El cuerpo queda roto"
 advanced_torture.1007.desc:0 "La tortura ha dejado a [advanced_torture_prisoner.GetShortUIName] con el cuerpo quebrado y la voluntad debilitada."
 advanced_torture.1007.a:0 "El cuerpo también obedece."

 advanced_torture.1008.t:0 "La tortura acaba en muerte"
 advanced_torture.1008.desc:0 "El cuerpo de [advanced_torture_prisoner.GetShortUIName] no ha resistido el tormento. Entre heridas, agotamiento y miedo, la vida se le escapa antes de que nadie pueda detenerlo."
 advanced_torture.1008.a:0 "Así termina su resistencia."

 advanced_torture_result_simple_whipping_01_desc:0 "Los guardias atan a [advanced_torture_prisoner.GetShortUIName] contra un poste húmedo de la mazmorra. El látigo cae una y otra vez, no con la furia de una ejecución, sino con la paciencia de un castigo calculado. Cada golpe abre paso al siguiente, hasta que la respiración del prisionero se convierte en una mezcla de rabia, vergüenza y súplica contenida."
 advanced_torture_result_simple_whipping_02_desc:0 "El cuero silba en el aire antes de golpear la espalda de [advanced_torture_prisoner.GetShortUIName]. Al principio intenta mantenerse firme, apretando los dientes y negándose a gritar, pero la repetición acaba haciendo su trabajo. Cuando los guardias lo sueltan, sus piernas apenas sostienen el peso de un orgullo ya humillado."
 advanced_torture_result_simple_whipping_03_desc:0 "Ordenas que el castigo sea medido, visible y recordado. [advanced_torture_prisoner.GetShortUIName] recibe los azotes bajo la mirada fría de los carceleros, mientras el eco de cada golpe se pierde por los pasillos de piedra. No es una mutilación, pero sí una advertencia escrita sobre la piel."

 advanced_torture_result_branding_iron_01_desc:0 "El hierro candente se acerca lentamente hasta que [advanced_torture_prisoner.GetShortUIName] comprende que no se trata de una amenaza. Los guardias lo sujetan con fuerza, el metal toca la carne y la celda se llena de un olor amargo y de un grito imposible de contener. Cuando apartan el hierro, la marca queda allí, oscura, roja y definitiva."
 advanced_torture_result_branding_iron_02_desc:0 "El brasero ilumina la mazmorra con un resplandor cruel. [advanced_torture_prisoner.GetShortUIName] intenta apartarse, pero las cadenas no conceden espacio. El hierro desciende, la piel cede al calor y el castigo se convierte en símbolo. Desde ahora, incluso en silencio, su cuerpo contará lo ocurrido."
 advanced_torture_result_branding_iron_03_desc:0 "No necesitas muchas palabras. Basta con levantar el hierro del fuego y dejar que [advanced_torture_prisoner.GetShortUIName] vea el brillo anaranjado antes del contacto. El miedo llega primero; el dolor, después. La marca queda sellada como una firma de autoridad sobre la piel vencida."

 advanced_torture_result_stocks_01_desc:0 "Los pies de [advanced_torture_prisoner.GetShortUIName] quedan atrapados en el cepo, inmóviles, torcidos por la incomodidad y expuestos al frío de la piedra. No hay sangre ni cuchillos, pero sí horas de dolor sordo, calambres y humillación. Cada intento de moverse solo consigue recordarle que incluso su postura depende ahora de tu voluntad."
 advanced_torture_result_stocks_02_desc:0 "El cepo se cierra con un golpe seco. [advanced_torture_prisoner.GetShortUIName] queda reducido a una figura incómoda y vencida, obligado a soportar miradas, burlas y el lento castigo del cuerpo inmóvil. La tortura no rompe huesos, pero desgasta la dignidad con una paciencia eficaz."
 advanced_torture_result_stocks_03_desc:0 "Los carceleros ajustan el cepo hasta que [advanced_torture_prisoner.GetShortUIName] deja de forcejear. Las horas pasan despacio: los tobillos duelen, la espalda se entumece y la vergüenza pesa más que las cadenas. Cuando finalmente lo liberan, camina como quien ha dejado parte de su orgullo entre la madera."

 advanced_torture_result_walk_of_shame_01_desc:0 "[advanced_torture_prisoner.GetShortUIName] es sacado de la celda bajo vigilancia, sucio, agotado y obligado a caminar ante quienes disfrutan de su caída. No hay heridas profundas, pero cada mirada pesa como una bofetada. La vergüenza se convierte en castigo público, y el prisionero aprende que el miedo también puede tomar la forma de una multitud."
 advanced_torture_result_walk_of_shame_02_desc:0 "Los guardias empujan a [advanced_torture_prisoner.GetShortUIName] por el patio, donde el murmullo crece hasta convertirse en burla. Cada paso parece más largo que el anterior. La humillación no deja cicatrices limpias, pero sí una memoria amarga que arde cada vez que alguien recuerda su nombre."
 advanced_torture_result_walk_of_shame_03_desc:0 "La puerta se abre y [advanced_torture_prisoner.GetShortUIName] comprende que el castigo no ocurrirá en la sombra. Lo obligan a mostrarse, a soportar risas, insultos y miradas satisfechas. Cuando vuelve a la celda, no sangra, pero algo en su orgullo ha quedado expuesto y pisoteado."

 advanced_torture_result_bastinado_01_desc:0 "Los pies de [advanced_torture_prisoner.GetShortUIName] son inmovilizados mientras los guardias preparan las varas. El primer golpe parece soportable; el décimo ya le arranca la compostura. La planta de los pies se convierte en un mapa de dolor, y cada movimiento futuro le recordará que incluso caminar puede ser un castigo."
 advanced_torture_result_bastinado_02_desc:0 "[advanced_torture_prisoner.GetShortUIName] intenta no gritar cuando las varas empiezan a caer sobre sus pies desnudos. La tortura parece simple, casi humilde, pero cada impacto se clava en nervios que no pueden protegerse. Cuando termina, el prisionero no sabe si teme más al próximo golpe o al primer paso que tendrá que dar."
 advanced_torture_result_bastinado_03_desc:0 "Ordenas el bastinado con una frialdad casi administrativa. Los guardias cumplen, golpe tras golpe, hasta que [advanced_torture_prisoner.GetShortUIName] deja de tensar el cuerpo y solo respira entre espasmos. No hay gran espectáculo, solo una certeza: el dolor puede esconderse en la parte más humilde del cuerpo."

 advanced_torture_result_water_torment_01_desc:0 "La tela húmeda cubre el rostro de [advanced_torture_prisoner.GetShortUIName] mientras el agua cae poco a poco. Al principio intenta respirar entre pausas; luego el pánico toma el control. No se ahoga del todo, pero su cuerpo no entiende la diferencia. Cada jarra vertida parece una muerte pequeña que se repite sin llegar a terminar."
 advanced_torture_result_water_torment_02_desc:0 "Los carceleros sujetan a [advanced_torture_prisoner.GetShortUIName] mientras el agua empapa la tela y le roba el aire. Sus manos se crispan, las cadenas tintinean y el miedo rompe cualquier intento de orgullo. Cuando por fin apartan la tela, respira como si regresara de una tumba líquida."
 advanced_torture_result_water_torment_03_desc:0 "No hay cuchillas, pero el tormento del agua convierte cada respiración en una batalla. [advanced_torture_prisoner.GetShortUIName] se agita bajo la tela, tragando terror, agua y súplicas. Cuando la sesión termina, todavía abre la boca buscando aire, incapaz de confiar en que el castigo haya acabado."

 advanced_torture_result_compression_cords_01_desc:0 "Los cordeles se enrollan alrededor de los dedos y extremidades de [advanced_torture_prisoner.GetShortUIName]. Al tensarlos, el dolor llega primero como presión y luego como fuego. No hace falta romper nada de inmediato; basta con apretar despacio, dejar que el cuerpo escuche sus propios límites y esperar a que la voluntad empiece a ceder."
 advanced_torture_result_compression_cords_02_desc:0 "Los guardias trabajan los cordeles con precisión cruel. Cada vuelta parece pequeña, pero todas juntas convierten la carne de [advanced_torture_prisoner.GetShortUIName] en una prisión más estrecha que los muros. La presión sube, las manos tiemblan y la voz del prisionero pierde fuerza con cada nudo."
 advanced_torture_result_compression_cords_03_desc:0 "[advanced_torture_prisoner.GetShortUIName] observa los cordeles antes de comprender su verdadera amenaza. Después ya solo siente cómo se hunden, cómo cortan la circulación y cómo transforman la espera en dolor. Cuando los retiran, las marcas quedan como anillos oscuros de obediencia forzada."

 advanced_torture_result_strappado_01_desc:0 "Las manos de [advanced_torture_prisoner.GetShortUIName] son atadas a la espalda antes de izarlo lentamente. El cuerpo sube, los hombros protestan y el peso entero cae donde no debería. Durante un instante intenta contenerse; después el dolor le arranca la voz. La cuerda cruje, y cada palmo de altura parece acercarlo a la ruptura."
 advanced_torture_result_strappado_02_desc:0 "El mecanismo tira de la cuerda y [advanced_torture_prisoner.GetShortUIName] queda suspendido con los brazos forzados detrás del cuerpo. No hay necesidad de golpearlo: su propio peso hace el trabajo. Los hombros tiemblan, la respiración se rompe y la celda escucha una súplica que tarda demasiado en llegar."
 advanced_torture_result_strappado_03_desc:0 "Ordenas que lo eleven. [advanced_torture_prisoner.GetShortUIName] deja el suelo atrás y descubre que el aire también puede ser una herramienta de tortura. Sus articulaciones arden, el cuerpo se estira de forma antinatural y los guardias esperan hasta que el orgullo cae antes que el prisionero."

 advanced_torture_result_thumbscrew_01_desc:0 "Los pulgares de [advanced_torture_prisoner.GetShortUIName] quedan atrapados entre las placas del instrumento. El tornillo gira despacio, casi con delicadeza, hasta que el dolor se vuelve imposible de ignorar. Cada vuelta es pequeña, pero definitiva, y el prisionero aprende que una tortura mínima puede llenar toda la celda."
 advanced_torture_result_thumbscrew_02_desc:0 "[advanced_torture_prisoner.GetShortUIName] mira el aplastapulgares con desprecio hasta que el metal empieza a cerrarse. Entonces la expresión cambia. La presión sube, los huesos protestan y la voz se quiebra en un jadeo bajo. No hay espectáculo grande, solo una precisión insoportable."
 advanced_torture_result_thumbscrew_03_desc:0 "El tornillo avanza poco a poco. [advanced_torture_prisoner.GetShortUIName] intenta apartar las manos, pero los guardias las mantienen firmes. El dolor se concentra en un punto tan pequeño que parece imposible que domine todo el cuerpo, y sin embargo lo hace."

 advanced_torture_result_short_stretching_bench_01_desc:0 "[advanced_torture_prisoner.GetShortUIName] es tendido sobre el banco corto y atado con correas ásperas. No hay espacio para la solemnidad del potro, solo una presión directa, cercana y brutal. Los guardias tiran hasta que el cuerpo se arquea, las articulaciones se quejan y el prisionero entiende que no hace falta una gran máquina para romper la resistencia."
 advanced_torture_result_short_stretching_bench_02_desc:0 "Las correas muerden las muñecas y tobillos de [advanced_torture_prisoner.GetShortUIName]. El banco parece demasiado simple para inspirar miedo, hasta que empieza el estiramiento. El cuerpo se tensa, el dolor corre por la espalda y cada orden de detenerse llega demasiado tarde para sonar digna."
 advanced_torture_result_short_stretching_bench_03_desc:0 "El banco de estiramiento corto permite a los carceleros trabajar de cerca. [advanced_torture_prisoner.GetShortUIName] siente cada tirón, cada ajuste y cada pausa calculada. Cuando lo desatan, no hay alivio verdadero: solo un cuerpo tembloroso que ya no confía en sus propios miembros."

  advanced_torture_result_rack_01_desc:0 "[advanced_torture_prisoner.GetShortUIName] es colocado sobre el potro y atado por muñecas y tobillos. Al principio solo hay tensión, madera que cruje y respiración contenida; luego los engranajes empiezan a girar. El cuerpo se estira contra su naturaleza, las articulaciones protestan y el prisionero descubre que el dolor puede crecer lentamente, sin prisa, hasta ocuparlo todo."
 advanced_torture_result_rack_02_desc:0 "Los carceleros ajustan las correas del potro con una calma que parece peor que la violencia. [advanced_torture_prisoner.GetShortUIName] intenta resistir, pero cada vuelta del mecanismo arranca un sonido distinto: primero rabia, luego miedo, después súplica. Cuando el tormento se detiene, no queda victoria en su mirada."
 advanced_torture_result_rack_03_desc:0 "Ordenas que el potro sea tensado poco a poco. La sala queda dominada por el gemido de la madera, el roce de las cuerdas y la voz rota de [advanced_torture_prisoner.GetShortUIName]. No hay golpe repentino, solo una presión constante que convierte cada segundo en una amenaza de ruptura."

 advanced_torture_result_wedged_boot_01_desc:0 "La bota de cuñas se cierra alrededor de la pierna de [advanced_torture_prisoner.GetShortUIName]. Los primeros golpes sobre las cuñas parecen secos y controlados, pero el dolor sube enseguida desde el hueso hasta la garganta. El prisionero intenta apartarse, aunque la madera y el hierro ya han decidido por él."
 advanced_torture_result_wedged_boot_02_desc:0 "Los guardias colocan la pierna de [advanced_torture_prisoner.GetShortUIName] dentro del instrumento y empiezan a introducir las cuñas. Cada golpe hunde más la presión, cada pausa permite entender lo que vendrá después. Cuando todo termina, incluso el silencio parece caminar cojo."
 advanced_torture_result_wedged_boot_03_desc:0 "La bota no necesita velocidad. Se alimenta de espera, de presión y del sonido de la cuña entrando donde no debería. [advanced_torture_prisoner.GetShortUIName] aprieta los dientes hasta que ya no puede hacerlo, y la celda aprende el sonido de una resistencia que se quiebra desde abajo."

 advanced_torture_result_rats_01_desc:0 "Los carceleros preparan el recipiente con una calma repugnante. [advanced_torture_prisoner.GetShortUIName] comprende demasiado tarde qué se agita dentro. El miedo llega antes que el dolor: un miedo animal, desesperado, que hace inútil cualquier orgullo. Cuando el tormento termina, el prisionero ya no mira las sombras de la celda del mismo modo."
 advanced_torture_result_rats_02_desc:0 "El suplicio de las ratas convierte la imaginación en parte del castigo. [advanced_torture_prisoner.GetShortUIName] se retuerce contra las ataduras mientras los carceleros acercan el calor y el pánico crece dentro del recipiente. No hace falta explicar nada; el cuerpo entiende la amenaza antes que la mente."
 advanced_torture_result_rats_03_desc:0 "La celda se llena de arañazos, respiración rota y súplicas atropelladas. [advanced_torture_prisoner.GetShortUIName] deja de fingir valor cuando el movimiento bajo el recipiente se vuelve frenético. Al final, la tortura deja heridas visibles, pero el verdadero daño queda en cada sobresalto posterior."

 advanced_torture_result_enucleation_01_desc:0 "Los guardias sujetan la cabeza de [advanced_torture_prisoner.GetShortUIName] mientras los instrumentos se preparan bajo la luz fría de la mazmorra. El prisionero entiende lo que va a perder antes de sentirlo, y ese instante de comprensión pesa más que cualquier amenaza. Cuando termina, el mundo se ha reducido para siempre."
 advanced_torture_result_enucleation_02_desc:0 "[advanced_torture_prisoner.GetShortUIName] intenta apartar el rostro, pero las manos de los carceleros lo mantienen inmóvil. La orden se cumple con una precisión terrible. El grito que sigue no pertenece al miedo común, sino a la certeza de que algo irremplazable ha sido arrancado de su vida."
 advanced_torture_result_enucleation_03_desc:0 "No hay forma limpia de obedecer una orden así. La celda se queda quieta mientras [advanced_torture_prisoner.GetShortUIName] pierde un ojo bajo tu mandato. Cuando los guardias retroceden, el prisionero ya no mira con desafío; mira con dolor, confusión y una memoria que no sanará."

 advanced_torture_result_leg_amputation_01_desc:0 "La amputación no llega como un castigo rápido, sino como una sentencia contra el futuro de [advanced_torture_prisoner.GetShortUIName]. Los guardias lo inmovilizan, los instrumentos se disponen y la celda se llena de un silencio pesado. Cuando todo termina, el prisionero sigue vivo, pero una parte de su vida ha quedado atrás para siempre."
 advanced_torture_result_leg_amputation_02_desc:0 "[advanced_torture_prisoner.GetShortUIName] forcejea hasta que las correas le roban toda posibilidad de huida. La orden se cumple entre gritos, paños manchados y órdenes secas de los carceleros. Después solo queda un cuerpo tembloroso y una certeza brutal: nunca volverá a caminar igual."
 advanced_torture_result_leg_amputation_03_desc:0 "La celda se convierte en sala de castigo y mutilación. [advanced_torture_prisoner.GetShortUIName] comprende que el dolor acabará algún día, pero la ausencia no. Cuando los guardias terminan, el prisionero queda exhausto, derrotado y atado a una pérdida que llevará hasta la tumba."

 advanced_torture_result_nail_cleaner_01_desc:0 "Los estiletes parecen instrumentos pequeños, casi insignificantes, hasta que se acercan a las uñas de [advanced_torture_prisoner.GetShortUIName]. El dolor llega en líneas finas y precisas, imposible de ignorar. No hay grandeza en este tormento, solo una intimidad cruel que hace temblar hasta los huesos."
 advanced_torture_result_nail_cleaner_02_desc:0 "[advanced_torture_prisoner.GetShortUIName] observa las manos de los carceleros y empieza a suplicar antes de que el metal haga su trabajo. Cada movimiento es lento, deliberado, diseñado para que el miedo tenga tiempo de crecer. Cuando termina, los dedos siguen ahí, pero parecen pertenecer a otro cuerpo."
 advanced_torture_result_nail_cleaner_03_desc:0 "El limpiador de uñas convierte una parte mínima del cuerpo en el centro del mundo. [advanced_torture_prisoner.GetShortUIName] se estremece con cada presión del estilete, incapaz de retirar las manos. La tortura no necesita grandes máquinas: basta con precisión, paciencia y una víctima que no puede apartarse."

 advanced_torture_result_phalaris_bull_01_desc:0 "El toro de bronce espera como una bestia inmóvil. Cuando [advanced_torture_prisoner.GetShortUIName] es encerrado en su interior, el metal aún está frío, pero el miedo ya arde. Luego los braseros se avivan, la prisión empieza a calentarse y los sonidos que salen de la figura hueca parecen menos humanos con cada instante."
 advanced_torture_result_phalaris_bull_02_desc:0 "Ordenas preparar el toro. Los guardias obedecen con una mezcla de miedo y fascinación, pues incluso entre verdugos hay métodos que parecen demasiado crueles. [advanced_torture_prisoner.GetShortUIName] desaparece dentro del bronce, y pronto la cámara escucha una agonía deformada por el metal."
 advanced_torture_result_phalaris_bull_03_desc:0 "El suplicio del toro no solo castiga a [advanced_torture_prisoner.GetShortUIName]; también convierte su sufrimiento en espectáculo. El bronce se calienta, las paredes amplifican los gritos y quienes escuchan apartan la mirada, aunque nadie se atreve a detener la orden."

 advanced_torture_result_judas_cradle_01_desc:0 "La cuna de Judas se alza en el centro de la celda como una amenaza simple y obscena. [advanced_torture_prisoner.GetShortUIName] es elevado lentamente, sostenido por cuerdas que conceden demasiado tiempo para comprender. El descenso es controlado, cruel, y cada pausa permite que el miedo haga su propia tortura."
 advanced_torture_result_judas_cradle_02_desc:0 "Los guardias manejan las cuerdas mientras [advanced_torture_prisoner.GetShortUIName] queda suspendido sobre el instrumento. No hay golpe, no hay prisa, solo gravedad y obediencia. El prisionero suplica antes de tocarlo, y cuando el tormento comienza, sus palabras se deshacen en sonidos rotos."
 advanced_torture_result_judas_cradle_03_desc:0 "La cuna de Judas castiga con lentitud. [advanced_torture_prisoner.GetShortUIName] siente cómo cada dedo de cuerda cedida empeora su destino. La celda se llena de tensión, gemidos y órdenes breves, hasta que el cuerpo ya no distingue entre dolor, vergüenza y terror."

 advanced_torture_result_pear_of_anguish_01_desc:0 "La pera de la Angustia es mostrada a [advanced_torture_prisoner.GetShortUIName] antes de usarse, porque parte del tormento está en entenderla. El metal se ajusta, el mecanismo responde y el prisionero pierde toda compostura. No es una tortura de fuerza bruta, sino de invasión, control y miedo absoluto."
 advanced_torture_result_pear_of_anguish_02_desc:0 "[advanced_torture_prisoner.GetShortUIName] intenta resistirse cuando los carceleros acercan el instrumento, pero las cadenas no permiten dignidad. La tortura avanza con movimientos pequeños, mecánicos, cada uno peor que el anterior. Al terminar, el silencio del prisionero parece más profundo que cualquier grito."
 advanced_torture_result_pear_of_anguish_03_desc:0 "El instrumento se abre bajo orden, despacio, con una crueldad casi ceremonial. [advanced_torture_prisoner.GetShortUIName] deja de maldecir y empieza a suplicar cuando comprende que el dolor no viene de un golpe, sino de una presión interna e inevitable."

 advanced_torture_result_iron_spider_01_desc:0 "La araña de hierro se calienta hasta adquirir un brillo oscuro y amenazante. Cuando toca a [advanced_torture_prisoner.GetShortUIName], el castigo llega en forma de presión, quemadura y desgarro controlado. Los guardias trabajan sin entusiasmo, como si incluso ellos prefirieran no mirar demasiado tiempo."
 advanced_torture_result_iron_spider_02_desc:0 "[advanced_torture_prisoner.GetShortUIName] retrocede hasta que las cadenas se tensan. La araña se acerca, sus puntas preparadas para convertir la piel en advertencia. El dolor arranca una reacción inmediata, pero el verdadero horror está en la pausa entre cada aplicación."
 advanced_torture_result_iron_spider_03_desc:0 "El metal de la araña deja marcas que no parecen humanas. [advanced_torture_prisoner.GetShortUIName] tiembla bajo las manos de los carceleros mientras el instrumento muerde, se retira y vuelve. Cuando termina, la celda huele a hierro, miedo y obediencia forzada."

 advanced_torture_result_torture_chair_01_desc:0 "La silla de clavos recibe a [advanced_torture_prisoner.GetShortUIName] sin necesidad de movimiento. Basta con obligarlo a sentarse, apretar las correas y dejar que el peso del cuerpo haga el resto. Cada intento de aliviar el dolor solo encuentra otra punta, otra presión, otra razón para quedarse inmóvil."
 advanced_torture_result_torture_chair_02_desc:0 "Los guardias empujan a [advanced_torture_prisoner.GetShortUIName] contra la silla y ajustan las sujeciones con fuerza. El tormento no avanza: permanece. Esa es su crueldad. El prisionero no puede encontrar postura, descanso ni esperanza, solo un dolor constante que convierte el tiempo en castigo."
 advanced_torture_result_torture_chair_03_desc:0 "La silla parece esperar pacientemente a su víctima. [advanced_torture_prisoner.GetShortUIName] comprende que no será torturado por golpes, sino por permanencia. Los clavos presionan, las correas inmovilizan y cada respiración recuerda que incluso estar sentado puede convertirse en suplicio."

 advanced_torture_result_skull_crusher_01_desc:0 "El aplastador de cráneos se coloca con una precisión terrible. [advanced_torture_prisoner.GetShortUIName] intenta apartarse, pero el hierro ya rodea su cabeza. El tornillo gira despacio, y cada vuelta trae una presión más profunda, más oscura, como si el mundo entero se cerrara sobre un único punto de dolor."
 advanced_torture_result_skull_crusher_02_desc:0 "No ordenas rapidez. Ordenas control. Los carceleros giran el mecanismo mientras [advanced_torture_prisoner.GetShortUIName] pierde la capacidad de desafiar, luego de insultar, luego casi de hablar. La presión convierte la valentía en pánico y el pánico en una súplica apenas reconocible."
 advanced_torture_result_skull_crusher_03_desc:0 "El instrumento parece demasiado simple para causar tanto miedo: hierro, tornillo y paciencia. [advanced_torture_prisoner.GetShortUIName] descubre pronto que no necesita más. Cada giro concentra el dolor detrás de los ojos, en la mandíbula, en la respiración. Cuando termina, nadie en la sala confunde silencio con resistencia."