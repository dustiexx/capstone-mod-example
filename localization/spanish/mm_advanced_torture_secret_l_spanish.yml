 advanced_torture.3001.t:0 "Un secreto revelado"
 advanced_torture.3001.desc:0 "Entre respiraciones rotas y palabras casi inaudibles, [advanced_torture_secret_bearer.GetShortUIName] ha revelado algo que jamás habría confesado por voluntad propia. La tortura ha abierto una grieta en su silencio."
 advanced_torture.3001.a:0 "Interesante..."