l_spanish:
 advanced_torture_interaction:0 "Tortura avanzada"
 advanced_torture_interaction_desc:0 "Somete a [recipient.GetShortUINameNoTooltip] a un tormento elegido desde un menú de torturas avanzadas."

 advanced_torture_cooldown:0 "Tortura reciente"
 advanced_torture_cooldown_desc:0 "Este personaje ha sido torturado recientemente y no puede ser sometido de nuevo a otra sesión de tortura avanzada por ahora."

 advanced_torture_recently_tortured:0 "Torturado recientemente"
 advanced_torture_recently_tortured_desc:0 "Este personaje ha sufrido una tortura reciente. El dolor, el miedo y las heridas todavía pesan sobre su cuerpo y su ánimo."

 advanced_torture_recovery_minor:0 "Recuperación de tortura leve"
 advanced_torture_recovery_minor_desc:0 "Este personaje se recupera de un tormento menor. Las marcas son visibles, pero el daño no parece irreversible."

 advanced_torture_recovery_medium:0 "Recuperación de tortura media"
 advanced_torture_recovery_medium_desc:0 "Este personaje se recupera de una tortura seria. El cuerpo sigue debilitado y la mente conserva el recuerdo del suplicio."

 advanced_torture_recovery_severe:0 "Recuperación de tortura severa"
 advanced_torture_recovery_severe_desc:0 "Este personaje arrastra las consecuencias de una tortura brutal. Las heridas, el miedo y la humillación han dejado una marca profunda."

 advanced_torture_tortured_me_opinion:0 "Me torturó"
 advanced_torture_tortured_family_member_opinion:0 "Torturó a un familiar"

