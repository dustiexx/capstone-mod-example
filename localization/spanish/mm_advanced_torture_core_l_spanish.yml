 advanced_torture_light_torture_tt:0 "Una tortura leve. Provoca daño menor, humillación y resentimiento, pero rara vez deja consecuencias permanentes."
 advanced_torture_medium_torture_tt:0 "Una tortura media. Puede causar heridas, deterioro físico, miedo duradero y una mayor probabilidad de revelar secretos."
 advanced_torture_strong_torture_tt:0 "Una tortura fuerte. Puede dejar secuelas graves, mutilaciones, enfermedades, daño mental o incluso la muerte accidental."
 advanced_torture_sadistic_torture_tt:0 "Una tortura sádica. Solo quienes poseen una crueldad excepcional pueden ordenar estos tormentos sin retroceder."
 advanced_torture_enucleation_tt:0 "Arranca un ojo al prisionero. No puede usarse contra personajes que ya sean tuertos o ciegos."
 advanced_torture_leg_amputation_tt:0 "Amputa una pierna al prisionero. No puede usarse contra personajes que ya hayan perdido una pierna."
 advanced_torture_tortured_to_survive:0 "Torturado para vivir"
 advanced_torture_tortured_to_survive_desc:0 "Este prisionero está siendo mantenido al borde de la muerte por un torturador experto, no por misericordia, sino para prolongar el tormento."
