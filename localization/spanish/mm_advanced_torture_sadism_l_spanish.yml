l_spanish:
 advanced_torture.5500.t:0 "El placer de la crueldad"
 advanced_torture.5500.desc:0 "Al principio, cada tormento era solo una herramienta: una llave para abrir secretos, una advertencia para los enemigos, un método para imponer obediencia. Pero algo ha cambiado. Cuando empiezan los gritos, ya no apartas la mirada. Cuando das la orden, ya no sientes el mismo peso que antes. En algún rincón oscuro de tu alma, la crueldad ha dejado de ser un medio y se ha convertido en una satisfacción."
 advanced_torture.5500.a:0 "El miedo ajeno tiene un sabor extraño..."