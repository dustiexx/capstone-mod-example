 advanced_torture_result_cultural_clan_stone_03_desc: "Los instrumentos de piedra del clan son retirados con calma. Quedan marcas, respiración entrecortada y una humillación cuidadosamente ritualizada."
 advanced_torture.cultural.oath_circle: "Círculo de Juramento"
 advanced_torture.scene.cultural.oath_circle.t: "Círculo de Juramento"
 advanced_torture.scene.cultural.oath_circle.desc: "Preparan círculo de juramento para [advanced_torture_prisoner.GetTitledFirstName]. No es una pena de muerte, sino una tortura escogida por su carga cultural: postes y cuerdas forman un círculo de juramento; dentro, el prisionero es tensado de un lado a otro hasta que la promesa rota parece apretar sus huesos."
 advanced_torture_result_cultural_oath_circle_01_desc: "Círculo de Juramento deja a [advanced_torture_prisoner.GetTitledFirstName] temblando, con la dignidad quebrada por un método que los presentes reconocen como propio de su tierra."
