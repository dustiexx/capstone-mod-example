 advanced_torture.cultural.bard_knot: "Nudo del Bardo"
 advanced_torture.scene.cultural.bard_knot.t: "Nudo del Bardo"
 advanced_torture.scene.cultural.bard_knot.desc: "Preparan nudo del bardo para [advanced_torture_prisoner.GetTitledFirstName]. No es una pena de muerte, sino una tortura escogida por su carga cultural: cuerdas anudadas al estilo de los bardos se deslizan por dedos, muñecas y garganta, apretando con ritmo ceremonial cada vez que se recita una falta."
 advanced_torture_result_cultural_bard_knot_01_desc: "Nudo del Bardo deja a [advanced_torture_prisoner.GetTitledFirstName] temblando, con la dignidad quebrada por un método que los presentes reconocen como propio de su tierra."
