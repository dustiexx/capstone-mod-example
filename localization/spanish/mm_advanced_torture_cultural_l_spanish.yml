 advanced_torture_result_cultural_thing_stones_03_desc: "Los instrumentos de piedras del thing son retirados con calma. Quedan marcas, respiración entrecortada y una humillación cuidadosamente ritualizada."
 advanced_torture.cultural.runes_under_skin: "Runas Bajo la Piel"
 advanced_torture.scene.cultural.runes_under_skin.t: "Runas Bajo la Piel"
 advanced_torture.scene.cultural.runes_under_skin.desc: "Preparan runas bajo la piel para [advanced_torture_prisoner.GetTitledFirstName]. No es una pena de muerte, sino una tortura escogida por su carga cultural: un cuchillo fino abre runas superficiales sobre la piel, más marca de vergüenza que herida mortal, mientras se pronuncian viejos nombres de culpa."
 advanced_torture_result_cultural_runes_under_skin_01_desc: "Runas Bajo la Piel deja a [advanced_torture_prisoner.GetTitledFirstName] temblando, con la dignidad quebrada por un método que los presentes reconocen como propio de su tierra."
