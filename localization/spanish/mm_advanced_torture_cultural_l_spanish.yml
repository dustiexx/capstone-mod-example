 advanced_torture.scene.cultural.samurai_oath_gag.desc: "Preparan mordaza del juramento samurai para [advanced_torture_prisoner.GetTitledFirstName]. No es una pena de muerte, sino una tortura escogida por su carga cultural: la mordaza del juramento samurai fuerza mandíbula y silencio, castigando la desobediencia como una mancha sobre el honor."
 advanced_torture_result_cultural_samurai_oath_gag_01_desc: "Mordaza del Juramento Samurai deja a [advanced_torture_prisoner.GetTitledFirstName] temblando, con la dignidad quebrada por un método que los presentes reconocen como propio de su tierra."
 advanced_torture_result_cultural_samurai_oath_gag_02_desc: "Cuando termina mordaza del juramento samurai, el silencio en la cámara pesa tanto como las heridas. [advanced_torture_prisoner.GetTitledFirstName] ha comprendido que el dolor también puede hablar el idioma de una cultura."
 advanced_torture_result_cultural_samurai_oath_gag_03_desc: "Los instrumentos de mordaza del juramento samurai son retirados con calma. Quedan marcas, respiración entrecortada y una humillación cuidadosamente ritualizada."
 advanced_torture.cultural.lacquered_bamboo_needles: "Agujas de Bambú Lacado"
 advanced_torture.scene.cultural.lacquered_bamboo_needles.t: "Agujas de Bambú Lacado"
