 advanced_torture.cultural.drakkar_stocks: "Cepo del Drakkar"
 advanced_torture.scene.cultural.drakkar_stocks.t: "Cepo del Drakkar"
 advanced_torture.scene.cultural.drakkar_stocks.desc: "Preparan cepo del drakkar para [advanced_torture_prisoner.GetTitledFirstName]. No es una pena de muerte, sino una tortura escogida por su carga cultural: un armazón de tablones curvos, hecho a semejanza del banco de remo de un drakkar, le fuerza hombros y espalda hasta que cada respiración parece astillar la madera."
 advanced_torture_result_cultural_drakkar_stocks_01_desc: "Cepo del Drakkar deja a [advanced_torture_prisoner.GetTitledFirstName] temblando, con la dignidad quebrada por un método que los presentes reconocen como propio de su tierra."
 advanced_torture_result_cultural_drakkar_stocks_02_desc: "Cuando termina cepo del drakkar, el silencio en la cámara pesa tanto como las heridas. [advanced_torture_prisoner.GetTitledFirstName] ha comprendido que el dolor también puede hablar el idioma de una cultura."
 advanced_torture_result_cultural_drakkar_stocks_03_desc: "Los instrumentos de cepo del drakkar son retirados con calma. Quedan marcas, respiración entrecortada y una humillación cuidadosamente ritualizada."
 advanced_torture.cultural.broken_oath_ring: "Aro del Juramento Roto"
 advanced_torture.scene.cultural.broken_oath_ring.t: "Aro del Juramento Roto"
 advanced_torture.scene.cultural.broken_oath_ring.desc: "Preparan aro del juramento roto para [advanced_torture_prisoner.GetTitledFirstName]. No es una pena de muerte, sino una tortura escogida por su carga cultural: un aro de hierro, reservado a quienes quebraron juramentos, se cierra sobre cuello y muñecas mientras los testigos recuerdan en voz alta su deshonra."
 advanced_torture_result_cultural_broken_oath_ring_01_desc: "Aro del Juramento Roto deja a [advanced_torture_prisoner.GetTitledFirstName] temblando, con la dignidad quebrada por un método que los presentes reconocen como propio de su tierra."
 advanced_torture_result_cultural_broken_oath_ring_02_desc: "Cuando termina aro del juramento roto, el silencio en la cámara pesa tanto como las heridas. [advanced_torture_prisoner.GetTitledFirstName] ha comprendido que el dolor también puede hablar el idioma de una cultura."
 advanced_torture_result_cultural_broken_oath_ring_03_desc: "Los instrumentos de aro del juramento roto son retirados con calma. Quedan marcas, respiración entrecortada y una humillación cuidadosamente ritualizada."
 advanced_torture.cultural.viking_sail_rope: "Cuerda de Vela Vikinga"
 advanced_torture.scene.cultural.viking_sail_rope.t: "Cuerda de Vela Vikinga"
 advanced_torture.scene.cultural.viking_sail_rope.desc: "Preparan cuerda de vela vikinga para [advanced_torture_prisoner.GetTitledFirstName]. No es una pena de muerte, sino una tortura escogida por su carga cultural: cuerdas de vela endurecidas por sal y brea se tensan alrededor de brazos y torso, dejando surcos ásperos como cabos mojados sobre la piel."
 advanced_torture_result_cultural_viking_sail_rope_01_desc: "Cuerda de Vela Vikinga deja a [advanced_torture_prisoner.GetTitledFirstName] temblando, con la dignidad quebrada por un método que los presentes reconocen como propio de su tierra."
 advanced_torture_result_cultural_viking_sail_rope_02_desc: "Cuando termina cuerda de vela vikinga, el silencio en la cámara pesa tanto como las heridas. [advanced_torture_prisoner.GetTitledFirstName] ha comprendido que el dolor también puede hablar el idioma de una cultura."
 advanced_torture_result_cultural_viking_sail_rope_03_desc: "Los instrumentos de cuerda de vela vikinga son retirados con calma. Quedan marcas, respiración entrecortada y una humillación cuidadosamente ritualizada."
 advanced_torture.cultural.thing_stones: "Piedras del Thing"
 advanced_torture.scene.cultural.thing_stones.t: "Piedras del Thing"
 advanced_torture.scene.cultural.thing_stones.desc: "Preparan piedras del thing para [advanced_torture_prisoner.GetTitledFirstName]. No es una pena de muerte, sino una tortura escogida por su carga cultural: piedras lisas del lugar de asamblea se colocan sobre manos y piernas, una presión pública y calculada ante el silencio del thing."
 advanced_torture_result_cultural_thing_stones_01_desc: "Piedras del Thing deja a [advanced_torture_prisoner.GetTitledFirstName] temblando, con la dignidad quebrada por un método que los presentes reconocen como propio de su tierra."
