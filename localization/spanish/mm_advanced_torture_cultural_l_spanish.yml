 advanced_torture.cultural.clan_stone: "Piedra del Clan"
 advanced_torture.scene.cultural.clan_stone.t: "Piedra del Clan"
 advanced_torture.scene.cultural.clan_stone.desc: "Preparan piedra del clan para [advanced_torture_prisoner.GetTitledFirstName]. No es una pena de muerte, sino una tortura escogida por su carga cultural: la piedra del clan descansa sobre el pecho y las manos del cautivo, no para matarlo, sino para recordarle el peso de la autoridad que lo ha condenado."
 advanced_torture_result_cultural_clan_stone_01_desc: "Piedra del Clan deja a [advanced_torture_prisoner.GetTitledFirstName] temblando, con la dignidad quebrada por un método que los presentes reconocen como propio de su tierra."
