 advanced_torture.cultural.veche_rod: "Vara del Veche"
 advanced_torture.scene.cultural.veche_rod.t: "Vara del Veche"
 advanced_torture.scene.cultural.veche_rod.desc: "Preparan vara del veche para [advanced_torture_prisoner.GetTitledFirstName]. No es una pena de muerte, sino una tortura escogida por su carga cultural: varas ceremoniales del veche caen sobre espalda y manos con golpes medidos, castigo de plaza y de asamblea, no de verdugo oculto."
 advanced_torture_result_cultural_veche_rod_01_desc: "Vara del Veche deja a [advanced_torture_prisoner.GetTitledFirstName] temblando, con la dignidad quebrada por un método que los presentes reconocen como propio de su tierra."
 advanced_torture_result_cultural_veche_rod_02_desc: "Cuando termina vara del veche, el silencio en la cámara pesa tanto como las heridas. [advanced_torture_prisoner.GetTitledFirstName] ha comprendido que el dolor también puede hablar el idioma de una cultura."
 advanced_torture_result_cultural_veche_rod_03_desc: "Los instrumentos de vara del veche son retirados con calma. Quedan marcas, respiración entrecortada y una humillación cuidadosamente ritualizada."
 advanced_torture.cultural.birch_ring: "Aro de Abedul"
 advanced_torture.scene.cultural.birch_ring.t: "Aro de Abedul"
 advanced_torture.scene.cultural.birch_ring.desc: "Preparan aro de abedul para [advanced_torture_prisoner.GetTitledFirstName]. No es una pena de muerte, sino una tortura escogida por su carga cultural: aros de abedul humedecido se ajustan sobre muñecas y tobillos; al tensarse, la madera clara muerde carne y tendón con paciencia cruel."
 advanced_torture_result_cultural_birch_ring_01_desc: "Aro de Abedul deja a [advanced_torture_prisoner.GetTitledFirstName] temblando, con la dignidad quebrada por un método que los presentes reconocen como propio de su tierra."
 advanced_torture_result_cultural_birch_ring_02_desc: "Cuando termina aro de abedul, el silencio en la cámara pesa tanto como las heridas. [advanced_torture_prisoner.GetTitledFirstName] ha comprendido que el dolor también puede hablar el idioma de una cultura."
 advanced_torture_result_cultural_birch_ring_03_desc: "Los instrumentos de aro de abedul son retirados con calma. Quedan marcas, respiración entrecortada y una humillación cuidadosamente ritualizada."
