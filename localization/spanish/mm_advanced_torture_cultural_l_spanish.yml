 advanced_torture_result_cultural_bard_knot_03_desc: "Los instrumentos de nudo del bardo son retirados con calma. Quedan marcas, respiración entrecortada y una humillación cuidadosamente ritualizada."
 advanced_torture.cultural.peat_stocks: "Cepo de Turba"
 advanced_torture.scene.cultural.peat_stocks.t: "Cepo de Turba"
 advanced_torture.scene.cultural.peat_stocks.desc: "Preparan cepo de turba para [advanced_torture_prisoner.GetTitledFirstName]. No es una pena de muerte, sino una tortura escogida por su carga cultural: un cepo bajo y húmedo, cubierto de turba negra, fija rodillas y muñecas hasta que el frío del suelo muerde sin necesidad de prolongar el castigo."
 advanced_torture_result_cultural_peat_stocks_01_desc: "Cepo de Turba deja a [advanced_torture_prisoner.GetTitledFirstName] temblando, con la dignidad quebrada por un método que los presentes reconocen como propio de su tierra."
 advanced_torture_result_cultural_peat_stocks_02_desc: "Cuando termina cepo de turba, el silencio en la cámara pesa tanto como las heridas. [advanced_torture_prisoner.GetTitledFirstName] ha comprendido que el dolor también puede hablar el idioma de una cultura."
 advanced_torture_result_cultural_peat_stocks_03_desc: "Los instrumentos de cepo de turba son retirados con calma. Quedan marcas, respiración entrecortada y una humillación cuidadosamente ritualizada."
 advanced_torture.cultural.blackthorn_needles: "Agujas de Espino Negro"
 advanced_torture.scene.cultural.blackthorn_needles.t: "Agujas de Espino Negro"
 advanced_torture.scene.cultural.blackthorn_needles.desc: "Preparan agujas de espino negro para [advanced_torture_prisoner.GetTitledFirstName]. No es una pena de muerte, sino una tortura escogida por su carga cultural: espinas de endrino, finas y oscuras, se clavan apenas bajo la piel para arrancar dolor punzante y una humillación difícil de ocultar."
 advanced_torture_result_cultural_blackthorn_needles_01_desc: "Agujas de Espino Negro deja a [advanced_torture_prisoner.GetTitledFirstName] temblando, con la dignidad quebrada por un método que los presentes reconocen como propio de su tierra."
