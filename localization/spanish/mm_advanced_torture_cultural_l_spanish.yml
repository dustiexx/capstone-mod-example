 advanced_torture.scene.cultural.stone_temple_press.desc: "Preparan prensa del templo de piedra para [advanced_torture_prisoner.GetTitledFirstName]. No es una pena de muerte, sino una tortura escogida por su carga cultural: la prensa del templo de piedra usa losas pequeñas y sagradas sobre manos y piernas, peso ritual que no busca matar pero sí quebrar."
 advanced_torture_result_cultural_stone_temple_press_01_desc: "Prensa del Templo de Piedra deja a [advanced_torture_prisoner.GetTitledFirstName] temblando, con la dignidad quebrada por un método que los presentes reconocen como propio de su tierra."
 advanced_torture_result_cultural_stone_temple_press_02_desc: "Cuando termina prensa del templo de piedra, el silencio en la cámara pesa tanto como las heridas. [advanced_torture_prisoner.GetTitledFirstName] ha comprendido que el dolor también puede hablar el idioma de una cultura."
 advanced_torture_result_cultural_stone_temple_press_03_desc: "Los instrumentos de prensa del templo de piedra son retirados con calma. Quedan marcas, respiración entrecortada y una humillación cuidadosamente ritualizada."
