l_russian:
 advanced_torture.0001.t:0 "Изысканная пытка"
 advanced_torture.0001.desc:0 "[advanced_torture_prisoner.GetShortUIName] в вашей власти. Камера холодна, сыра и безмолвна, тишину нарушают лишь звон цепей и дрожащее дыхание узника. Вы можете приказать лёгкое наказание, перейти к более суровым методам, начать длительную пытку или открыть дверь к мучениям, предназначенным для поистине безжалостных."
 advanced_torture.0001.light:0 "Лёгкие пытки"
 advanced_torture.0001.medium:0 "Умеренные пытки"
 advanced_torture.0001.strong:0 "Жестокие пытки"
 advanced_torture.0001.long_tortures:0 "Длительные пытки"
 advanced_torture.0001.unique:0 "Особые пытки"
 advanced_torture.0001.cancel:0 "Не стоит"

 advanced_torture.0002.t:0 "Лёгкие пытки"
 advanced_torture.0002.desc:0 "Не всякая пытка призвана уничтожить тело. Некоторым достаточно унизить, заклеймить или сломить достоинство, не превращая камеру в бойню."
 advanced_torture.0002.simple_whipping:0 "Порка плетью"
 advanced_torture.0002.branding_iron:0 "Клеймение"
 advanced_torture.0002.stocks:0 "Колодки для ног"
 advanced_torture.0002.walk_of_shame:0 "Позорный проход"

 advanced_torture.0003.t:0 "Умеренные пытки"
 advanced_torture.0003.desc:0 "Эти методы — уже не просто наказания. Они предназначены, чтобы сломить сопротивление, выбить признания и оставить у узника незабываемое воспоминание о боли, которую может причинить ваша власть."
 advanced_torture.0003.bastinado:0 "Бастинадо"
 advanced_torture.0003.water_torment:0 "Пытка водой"
 advanced_torture.0003.compression_cords:0 "Сдавливающие верёвки"
 advanced_torture.0003.strappado:0 "Страппадо"
 advanced_torture.0003.thumbscrew:0 "Тиски для пальцев"
 advanced_torture.0003.short_stretching_bench:0 "Короткая дыба"

 advanced_torture.0004.t:0 "Жестокие пытки"
 advanced_torture.0004.desc:0 "Здесь предупреждения кончаются и начинаются неизлечимые раны. Эти мучения оставляют изломанные тела, бесполезные конечности, потерянные глаза и воспоминания, которые не сотрёт ни один лекарь."
 advanced_torture.0004.rack:0 "Дыба"
 advanced_torture.0004.wedged_boot:0 "Сапог с клиньями"
 advanced_torture.0004.rats:0 "Крысиная пытка"
 advanced_torture.0004.enucleation:0 "Вырывание глаза"
 advanced_torture.0004.leg_amputation:0 "Ампутация ноги"
 advanced_torture.0004.nail_cleaner:0 "Ногтевые иглы"

 advanced_torture.0005.t:0 "Особые пытки"
 advanced_torture.0005.desc:0 "Некоторые мучения не подходят ни под одну обычную категорию. Они принадлежат определённым культурам, тёмным традициям, особым патчам совместимости или тем, кто уже переступил пределы обычной жестокости."
 advanced_torture.0005.sadistic:0 "Садистские пытки"
 advanced_torture.0005.cultural:0 "Культурные пытки"

 advanced_torture.0006.t:0 "Садистские пытки"
 advanced_torture.0006.desc:0 "Эти методы — не правосудие, не воспитание и не обычный допрос. Это акты исключительной жестокости, предназначенные для тех, кто находит удовольствие в страданиях других."
 advanced_torture.0006.phalaris_bull:0 "Медный бык Фаларида"
 advanced_torture.0006.judas_cradle:0 "Колыбель Иуды"
 advanced_torture.0006.pear_of_anguish:0 "Груша страданий"
 advanced_torture.0006.iron_spider:0 "Железный паук"
 advanced_torture.0006.torture_chair:0 "Стул с гвоздями"
 advanced_torture.0006.skull_crusher:0 "Давилка для черепа"

 advanced_torture.0007.t:0 "Культурные пытки"
 advanced_torture.0007.desc:0 "Культурные пытки предназначены для более позднего этапа. Пока что темницы не приготовили этих методов."
 advanced_torture.0007.empty:0 "Пока нет доступных культурных пыток"