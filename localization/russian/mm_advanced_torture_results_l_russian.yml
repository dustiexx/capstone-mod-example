l_russian:
 advanced_torture.1001.t:0 "Пытка окончена"
 advanced_torture.1001.desc:0 "Мучение закончено. [advanced_torture_prisoner.GetShortUIName] умолкает, [Select_CString(advanced_torture_prisoner.IsFemale, 'ослабленная', 'ослабленный')] болью и [Select_CString(advanced_torture_prisoner.IsFemale, 'отмеченная', 'отмеченный')] страхом."
 advanced_torture.1001.a:0 "Пусть запомнит это"

 advanced_torture.1002.t:0 "Метка поставлена"
 advanced_torture.1002.desc:0 "Железо оставило свой знак. [advanced_torture_prisoner.GetShortUIName] будет носить метку вашего наказания ещё долго после того, как боль утихнет."
 advanced_torture.1002.a:0 "Метка говорит громче тысячи угроз."

 advanced_torture.1004.t:0 "Глаз вырван"
 advanced_torture.1004.desc:0 "[advanced_torture_prisoner.GetShortUIName] [Select_CString(advanced_torture_prisoner.IsFemale, 'лишилась', 'лишился')] глаза по вашему приказу. Боль пройдёт, но увечье останется."
 advanced_torture.1004.a:0 "Пусть видят меньше, но помнят больше."

 advanced_torture.1007.t:0 "Тело сломлено"
 advanced_torture.1007.desc:0 "Пытка оставила [advanced_torture_prisoner.GetShortUIName] со сломленным телом и ослабленной волей."
 advanced_torture.1007.a:0 "Тело тоже подчиняется."

 advanced_torture.1008.t:0 "Пытка окончена смертью"
 advanced_torture.1008.desc:0 "Тело [advanced_torture_prisoner.GetShortUIName] не выдержало мучений. Между ранами, изнеможением и страхом жизнь ускользает прежде, чем кто-либо успевает остановить это."
 advanced_torture.1008.a:0 "Так кончается сопротивление."

 advanced_torture_result_simple_whipping_01_desc:0 "Стражи привязывают [advanced_torture_prisoner.GetShortUIName] к сырому столбу в темнице. Плеть опускается снова и снова, не с яростью казни, а с терпением выверенного наказания. Каждый удар прокладывает дорогу следующему, пока дыхание [Select_CString(advanced_torture_prisoner.IsFemale, 'узницы', 'узника')] не становится смесью ярости, стыда и сдерживаемых мольб."
 advanced_torture_result_simple_whipping_02_desc:0 "Кожаная плеть свистит в воздухе, прежде чем обрушиться на спину [advanced_torture_prisoner.GetShortUIName]. Сначала [Select_CString(advanced_torture_prisoner.IsFemale, 'узница', 'узник')] пытается держаться стойко, стиснув зубы и отказываясь кричать, но плеть в конце концов делает своё дело. Когда стражи отпускают, [Select_CString(advanced_torture_prisoner.IsFemale, 'её', 'его')] ноги едва выдерживают вес уже униженной гордости."
 advanced_torture_result_simple_whipping_03_desc:0 "Вы приказываете, чтобы наказание было размеренным, видимым и запоминающимся. [advanced_torture_prisoner.GetShortUIName] получает удары под холодным взглядом тюремщиков, а эхо каждого удара затихает в каменных коридорах. Это не увечье, но предупреждение, написанное на коже."

 advanced_torture_result_branding_iron_01_desc:0 "Раскалённое железо медленно приближается. Стражи держат [advanced_torture_prisoner.GetShortUIName] крепко, металл касается плоти, и камера наполняется горьким запахом и криком, который невозможно сдержать. Когда железо убирают, метка остаётся — обугленная, навек вросшая в кожу."
 advanced_torture_result_branding_iron_02_desc:0 "Жаровня освещает темницу жестоким светом. [advanced_torture_prisoner.GetShortUIName] пытается отстраниться, но цепи не позволят. Железо опускается, кожа в мгновение сгорает, и наказание становится символом. Отныне даже в молчании тело будет рассказывать о случившемся."
 advanced_torture_result_branding_iron_03_desc:0 "Вам не нужно много слов. Достаточно поднять железо из огня и дать [advanced_torture_prisoner.GetShortUIName] увидеть оранжевое свечение. Сначала приходит страх, потом боль. Метка запечатана как подпись власти на побеждённой коже."

 advanced_torture_result_stocks_01_desc:0 "Ноги [advanced_torture_prisoner.GetShortUIName] зажаты в колодках, неподвижны, скованные неудобством, и холод от камня пронимает их до костей. Нет крови, нет ножей, но есть часы тупой боли, судорог и унижения. Каждая попытка пошевелиться лишь напоминает узнику, что даже [Select_CString(advanced_torture_prisoner.IsFemale, 'её', 'его')] поза теперь зависит от вашей воли."
 advanced_torture_result_stocks_02_desc:0 "Колодки закрываются с глухим стуком. [advanced_torture_prisoner.GetShortUIName] [Select_CString(advanced_torture_prisoner.IsFemale, 'превращенная', 'превращенный')] в неловкую, поверженную фигуру, вынужденную терпеть взгляды, насмешки и медленное наказание неподвижного тела. Пытка не ломает кости, но с удивительным терпением изнашивает достоинство."
 advanced_torture_result_stocks_03_desc:0 "Тюремщики регулируют колодки, пока [advanced_torture_prisoner.GetShortUIName] не перестаёт бороться. Часы тянутся медленно: болят лодыжки, немеет спина, и стыд становится тяжелее цепей. Когда [Select_CString(advanced_torture_prisoner.IsFemale, 'узницу', 'узника')] наконец отпускают, [Select_CString(advanced_torture_prisoner.IsFemale, 'она', 'он')] идёт так, словно часть гордости осталась в камере."

 advanced_torture_result_walk_of_shame_01_desc:0 "[advanced_torture_prisoner.GetShortUIName] выводят из камеры под стражей — [Select_CString(advanced_torture_prisoner.IsFemale, 'грязную, измученную и вынужденную', 'грязного, измученного и вынужденного')] идти перед теми, кто наслаждается [Select_CString(advanced_torture_prisoner.IsFemale, 'её', 'его')] падением. Нет глубоких ран, но каждый взгляд весит как пощёчина. Стыд становится публичным наказанием, и [Select_CString(advanced_torture_prisoner.IsFemale, 'узница', 'узник')] узнаёт, что страх может принимать обличье толпы."
 advanced_torture_result_walk_of_shame_02_desc:0 "Стражи толкают [advanced_torture_prisoner.GetShortUIName] через двор, где шёпот перерастает в насмешку. Каждый шаг кажется длиннее предыдущего. Унижение не оставляет чистых шрамов, но оставляет горькую память, которая жжёт всякий раз, когда кто-то вспоминает [Select_CString(advanced_torture_prisoner.IsFemale, 'её', 'его')] имя."
 advanced_torture_result_walk_of_shame_03_desc:0 "Дверь открывается, и [advanced_torture_prisoner.GetShortUIName] понимает, что наказание состоится не в тени. [Select_CString(advanced_torture_prisoner.IsFemale, 'Её', 'Его')] заставляют показаться, вытерпеть смех, оскорбления и довольные взгляды. Когда [Select_CString(advanced_torture_prisoner.IsFemale, 'узница', 'узник')] возвращается в камеру, [Select_CString(advanced_torture_prisoner.IsFemale, 'она', 'он')] не истекает кровью, но что-то в [Select_CString(advanced_torture_prisoner.IsFemale, 'её', 'его')] гордости было выставлено напоказ и растоптано."

 advanced_torture_result_bastinado_01_desc:0 "Ноги [advanced_torture_prisoner.GetShortUIName] обездвижены, пока стражи готовят прутья. Первый удар кажется легким; десятый уже срывает самообладание. Подошвы ног становятся картой боли, и каждое будущее движение будет напоминать, что даже ходьба может быть наказанием."
 advanced_torture_result_bastinado_02_desc:0 "[advanced_torture_prisoner.GetShortUIName] пытается не кричать, когда прутья начинают опускаться на босые ступни. Пытка кажется простой, почти скромной, но каждый удар бьёт по нервам, которые не могут защитить себя. Когда всё кончается, [Select_CString(advanced_torture_prisoner.IsFemale, 'узница', 'узник')] не знает, чего бояться больше: следующего удара или первого шага, который придётся сделать."
 advanced_torture_result_bastinado_03_desc:0 "Вы приказываете бастинадо с полным хладнокровием. Стражи повинуются, удар за ударом, пока [advanced_torture_prisoner.GetShortUIName] не перестаёт напрягаться и только дышит сквозь спазмы. Нет великого зрелища, есть только боль, которая может скрываться в самой скромной части тела."

 advanced_torture_result_water_torment_01_desc:0 "Влажная ткань накрывает лицо [advanced_torture_prisoner.GetShortUIName], пока вода льётся понемногу. Сначала [Select_CString(advanced_torture_prisoner.IsFemale, 'узница', 'узник')] пытается дышать в паузах; затем паника берёт верх. [Select_CString(advanced_torture_prisoner.IsFemale, 'Она', 'Он')] не тонет полностью, но тело не понимает разницы. Каждый вылитый кувшин ощущается как маленькая смерть, повторяющаяся раз за разом."
 advanced_torture_result_water_torment_02_desc:0 "Тюремщики удерживают [advanced_torture_prisoner.GetShortUIName], пока вода пропитывает ткань и крадёт воздух. Руки сжимаются, цепи звенят, и страх разбивает любые попытки сохранить достоинство. Когда наконец снимают ткань, [Select_CString(advanced_torture_prisoner.IsFemale, 'узница', 'узник')] дышит так, будто [Select_CString(advanced_torture_prisoner.IsFemale, 'вернулась', 'вернулся')] из могилы."
 advanced_torture_result_water_torment_03_desc:0 "Нет лезвий, но водная пытка превращает каждый вдох в милость. [advanced_torture_prisoner.GetShortUIName] мечется под тканью, глотая ужас, воду и мольбы. Когда сессия заканчивается, [Select_CString(advanced_torture_prisoner.IsFemale, 'узница', 'узник')] всё ещё открывает рот в поисках воздуха, не в силах поверить, что наказание кончилось."

 advanced_torture_result_compression_cords_01_desc:0 "Верёвки обматывают пальцы и конечности [advanced_torture_prisoner.GetShortUIName]. Когда их затягивают, боль приходит сначала как давление, а потом как огонь. Ничего не нужно ломать сразу; достаточно затягивать медленно, дать телу услышать свои пределы и ждать, когда воля начнёт уступать."
 advanced_torture_result_compression_cords_02_desc:0 "Стражи работают с верёвками с жестокой точностью. Каждый оборот кажется маленьким, но вместе они превращают плоть [advanced_torture_prisoner.GetShortUIName] в тюрьму более узкую, чем стены. Давление растёт, руки дрожат, и голос [Select_CString(advanced_torture_prisoner.IsFemale, 'узницу', 'узника')] теряет силу с каждым узлом."
 advanced_torture_result_compression_cords_03_desc:0 "[advanced_torture_prisoner.GetShortUIName] смотрит на верёвки, прежде чем понять их истинную угрозу. После этого [Select_CString(advanced_torture_prisoner.IsFemale, 'узница', 'узник')] лишь чувствует, как они впиваются, как перекрывают кровоток и как превращают ожидание в боль. Когда их снимают, следы остаются тёмными кольцами вынужденного послушания."

 advanced_torture_result_strappado_01_desc:0 "Руки [advanced_torture_prisoner.GetShortUIName] связаны за спиной. [Select_CString(advanced_torture_prisoner.IsFemale, 'Узницу', 'Узника')] медленно поднимают на верёвке. Тело вытягивается, плечи выворачиваются, и вся тяжесть падает на связанные запястья. На мгновение [Select_CString(advanced_torture_prisoner.IsFemale, 'узница', 'узник')] пытается сдержать крик, но боль рвётся наружу. Верёвка скрипит, и каждый новый рывок вверх приближает к перелому."
 advanced_torture_result_strappado_02_desc:0 "Механизм тянет верёвку, и [advanced_torture_prisoner.GetShortUIName] остаётся висеть с руками, заведёнными за тело. Нет нужды наносить удары: собственный вес [Select_CString(advanced_torture_prisoner.IsFemale, 'узницу', 'узника')] делает работу. Плечи дрожат, дыхание прерывается, и все слышат мольбу, которая приходит слишком поздно."
 advanced_torture_result_strappado_03_desc:0 "Вы приказываете поднимать. [advanced_torture_prisoner.GetShortUIName] отрывается от пола и обнаруживает, что [Select_CString(advanced_torture_prisoner.IsFemale, 'её', 'его')] собственный вес может быть орудием пытки. Суставы горят, тело неестественно растягивается, и стражи ждут, пока гордость падёт раньше, чем [Select_CString(advanced_torture_prisoner.IsFemale, 'узница', 'узник')]."

 advanced_torture_result_thumbscrew_01_desc:0 "Большие пальцы [advanced_torture_prisoner.GetShortUIName] зажаты между пластинами инструмента. Винт поворачивается медленно, почти нежно, пока боль не искажает лицо в уродливой гримасе. Каждый оборот не велик, но болезненный, и [Select_CString(advanced_torture_prisoner.IsFemale, 'узница', 'узник')] узнаёт, что маленькая пытка может остаться в памяти навечно."
 advanced_torture_result_thumbscrew_02_desc:0 "[advanced_torture_prisoner.GetShortUIName] смотрит на тиски с презрением, пока металл не начинает сжиматься. Затем выражение меняется. Давление растёт, кости ноют от боли, и голос срывается в тихий хрип. Не ждите кровавого спектакля — эта пытка скромна. Она не тешит взгляд, а молча грызёт изнутри."
 advanced_torture_result_thumbscrew_03_desc:0 "Винт продвигается мало-помалу. [advanced_torture_prisoner.GetShortUIName] пытается отдёрнуть руки, но стражи держат их крепко. Боль собирается в такой маленькой точке, что кажется невозможным, чтобы она управляла всем телом, — и всё же управляет."

 advanced_torture_result_short_stretching_bench_01_desc:0 "[advanced_torture_prisoner.GetShortUIName] кладут на короткую дыбу и связывают грубыми ремнями. Никакой торжественности — только грубая, жестокая сила, действующая вплотную. Стражи тянут, пока тело не выгибается, суставы не взнывают от боли, и [Select_CString(advanced_torture_prisoner.IsFemale, 'узница', 'узник')] понимает, что для сломления воли не нужна большая машина."
 advanced_torture_result_short_stretching_bench_02_desc:0 "Ремни впиваются в запястья и лодыжки [advanced_torture_prisoner.GetShortUIName]. Скамья кажется слишком простой, чтобы внушать страх, пока не начинается растяжение. Тело напрягается, боль бежит по спине, и любой приказ остановиться может прозвучать уже слишком поздно."
 advanced_torture_result_short_stretching_bench_03_desc:0 "Короткая скамья позволяет тюремщикам работать вблизи. [advanced_torture_prisoner.GetShortUIName] чувствует каждое натяжение, каждое регулирование и каждую выверенную паузу. Когда [Select_CString(advanced_torture_prisoner.IsFemale, 'узницу', 'узника')] развязывают, нет никакого облегчения: только дрожащее тело, которое больше не доверяет собственным конечностям."

 advanced_torture_result_rack_01_desc:0 "[advanced_torture_prisoner.GetShortUIName] помещают на дыбу и привязывают за запястья и лодыжки. Сначала есть только напряжение, скрип дерева и затаённое дыхание; затем шестерни начинают вращаться. Тело растягивается против своей природы, суставы взнывают, и [Select_CString(advanced_torture_prisoner.IsFemale, 'узница', 'узник')] понимает, что боль может расти медленно, без спешки, пока не заполнит всё."
 advanced_torture_result_rack_02_desc:0 "Тюремщики регулируют ремни дыбы со спокойствием, которое кажется страшнее насилия. [advanced_torture_prisoner.GetShortUIName] пытается сопротивляться, но каждый поворот механизма вызывает разный звук: сначала ярость, потом страх, потом мольбу. Когда мучение прекращается, во взгляде [Select_CString(advanced_torture_prisoner.IsFemale, 'узницы', 'узника')] нет ничего, кроме боли."
 advanced_torture_result_rack_03_desc:0 "Вы приказываете затягивать дыбу, но не спеша. В комнате царит скрип дерева, шорох верёвок и сломленный голос [advanced_torture_prisoner.GetShortUIName]. Нет внезапного удара, только постоянное давление, превращающее каждую секунду в агонию."

 advanced_torture_result_wedged_boot_01_desc:0 "Сапог с клиньями смыкается вокруг ноги [advanced_torture_prisoner.GetShortUIName]. Первые удары по клиньям кажутся легкими и контролируемыми, но боль быстро поднимается от кости к горлу. [Select_CString(advanced_torture_prisoner.IsFemale, 'Узница', 'Узник')] пытается отстраниться, хотя дерево и железо уже всё решили за [Select_CString(advanced_torture_prisoner.IsFemale, 'неё', 'него')]."
 advanced_torture_result_wedged_boot_02_desc:0 "Стражи помещают ногу [advanced_torture_prisoner.GetShortUIName] в железный сапог и начинают вбивать клинья. Каждый удар вгоняет клин глубже, каждая пауза позволяет понять, что будет дальше. Когда всё кончено, в тишине слышны лишь отголоски боли."
 advanced_torture_result_wedged_boot_03_desc:0 "Сапогу не нужна спешка. Он питается ожиданием, давлением и звуком клина, входящего в ногу. [advanced_torture_prisoner.GetShortUIName] сжимает зубы, пока может, и камера слышит звук сопротивления, ломающегося снизу."

 advanced_torture_result_rats_01_desc:0 "Тюремщики готовят сосуд с пугающим спокойствием. [advanced_torture_prisoner.GetShortUIName] понимает слишком поздно, что шевелится внутри. Страх приходит раньше боли: животный, отчаянный страх, делающий любую гордость бесполезной. Когда мучение заканчивается, [Select_CString(advanced_torture_prisoner.IsFemale, 'узница', 'узник')] уже не смотрит на тени камеры по-старому."
 advanced_torture_result_rats_02_desc:0 "Крысиная пытка превращает воображение в часть наказания. [advanced_torture_prisoner.GetShortUIName] извивается в оковах, пока тюремщики приближают жар и паника растёт внутри ведра. Ничего не нужно объяснять; тело понимает угрозу раньше разума."
 advanced_torture_result_rats_03_desc:0 "Камера наполняется царапаньем, сбитым дыханием и сбивчивыми мольбами. [advanced_torture_prisoner.GetShortUIName] перестаёт притворяться [Select_CString(advanced_torture_prisoner.IsFemale, 'храброй', 'храбрым')], когда движение под ведром становится судорожным. В конце концов пытка оставляет видимые раны, но истинный ущерб остаётся в каждом последующем вздрагивании."

 advanced_torture_result_enucleation_01_desc:0 "Стражи держат голову [advanced_torture_prisoner.GetShortUIName], пока инструменты готовят под холодным светом темницы. [Select_CString(advanced_torture_prisoner.IsFemale, 'Узница', 'Узник')] понимает, что [Select_CString(advanced_torture_prisoner.IsFemale, 'она', 'он')] сейчас лишится глаза, прежде чем почувствует это, и это мгновение понимания весит больше любой угрозы. Когда всё кончено, мир уже не станет прежним."
 advanced_torture_result_enucleation_02_desc:0 "[advanced_torture_prisoner.GetShortUIName] пытается отвернуть лицо, но руки тюремщиков держат [Select_CString(advanced_torture_prisoner.IsFemale, 'её', 'его')] неподвижно. Приказ выполняется с ужасающей точностью. Последовавший крик — не от страха, а от понимания: отныне мир виден лишь одним глазом."
 advanced_torture_result_enucleation_03_desc:0 "Нет чистого способа выполнить такой приказ. Камера замирает, когда по вашему приказу из [Select_CString(advanced_torture_prisoner.IsFemale, 'её', 'его')] глазницы вырывают глаз. Когда стражи отступают, [Select_CString(advanced_torture_prisoner.IsFemale, 'узница', 'узник')] смотрит уже не с вызовом, а с болью, замешательством и памятью, которая не заживёт."

 advanced_torture_result_leg_amputation_01_desc:0 "Ампутация приходит не как быстрое наказание, а как приговор против будущего [advanced_torture_prisoner.GetShortUIName]. Стражи обездвиживают [Select_CString(advanced_torture_prisoner.IsFemale, 'узницу', 'узника')], инструменты раскладывают, камера наполняется тяжёлой тишиной. Когда всё кончено, [Select_CString(advanced_torture_prisoner.IsFemale, 'узница', 'узник')] ещё [Select_CString(advanced_torture_prisoner.IsFemale, 'жива', 'жив')], но часть [Select_CString(advanced_torture_prisoner.IsFemale, 'её', 'его')] жизни осталась позади навсегда."
 advanced_torture_result_leg_amputation_02_desc:0 "[advanced_torture_prisoner.GetShortUIName] борется, пока ремни не отнимают всякую надежду на побег. Приказ выполняется под крики, залитые кровью тряпки и отрывистые команды тюремщиков. После остаётся только дрожащее тело и осознание: что [advanced_torture_prisoner.GetShortUIName] уже никогда не будет ходить по-прежнему."
 advanced_torture_result_leg_amputation_03_desc:0 "Камера становится комнатой наказания и увечья. [advanced_torture_prisoner.GetShortUIName] понимает, что боль когда-нибудь кончится, но пустота — нет. Когда стражи заканчивают, [Select_CString(advanced_torture_prisoner.IsFemale, 'узница остаётся измотанной, побеждённой и прикованной', 'узник остаётся измотанным, побеждённым и прикованным')] к потере, которую унесёт с собой в могилу."

 advanced_torture_result_nail_cleaner_01_desc:0 "Ногтевые иглы кажутся маленькими, почти незначительными инструментами, пока не приближаются к ногтям [advanced_torture_prisoner.GetShortUIName]. Боль приходит тонкими, точными линиями, которые невозможно игнорировать. В этой пытке нет величия, только жестокость, заставляющая кости дрожать."
 advanced_torture_result_nail_cleaner_02_desc:0 "[advanced_torture_prisoner.GetShortUIName] смотрит на руки тюремщиков и начинает умолять прежде, чем металл сделает своё дело. Каждое движение медленно, обдуманно, чтобы у страха было время вырасти. Когда всё кончается, пальцы всё ещё на месте, но кажутся принадлежащими другому телу."
 advanced_torture_result_nail_cleaner_03_desc:0 "Ногтевая игла превращает крошечную часть тела в центр мира. [advanced_torture_prisoner.GetShortUIName] вздрагивает от каждого нажатия на иглу, не в силах отдёрнуть руки. Пытке не нужны большие машины: достаточно точности, терпения и жертвы, которая не может отвернуться."

 advanced_torture_result_phalaris_bull_01_desc:0 "Медный бык ждёт, как неподвижный зверь. Когда [advanced_torture_prisoner.GetShortUIName] запирают внутри, металл ещё холоден, но страх уже горит. Затем разжигают жаровни, медная темница начинает нагреваться, и звуки, доносящиеся из полой фигуры, с каждым мгновением становятся всё менее человеческими."
 advanced_torture_result_phalaris_bull_02_desc:0 "Вы приказываете приготовить быка. Стражи повинуются со смесью страха и очарования, ибо даже среди палачей есть методы, кажущиеся слишком жестокими. [advanced_torture_prisoner.GetShortUIName] исчезает внутри меди, и вскоре все слышат агонию, искажённую металлом."
 advanced_torture_result_phalaris_bull_03_desc:0 "Пытка быком не просто наказывает [advanced_torture_prisoner.GetShortUIName]; она превращает страдание в зрелище. Медь нагревается, стены усиливают крики, и те, кто слушает, отводят взгляды, хотя никто не осмелится остановить приказ."

 advanced_torture_result_judas_cradle_01_desc:0 "Колыбель Иуды возвышается в центре камеры как простая и непристойная угроза. [advanced_torture_prisoner.GetShortUIName] медленно поднимают на верёвках, давая слишком много времени на понимание. Затем начинают опускать — контролируемо, жестоко. Острие колыбели входит между ног, и каждая пауза позволяет страху совершить свою собственную пытку."
 advanced_torture_result_judas_cradle_02_desc:0 "Стражи управляют верёвками, пока [advanced_torture_prisoner.GetShortUIName] висит над инструментом. Нет удара, нет спешки, только гравитация и повиновение. [Select_CString(advanced_torture_prisoner.IsFemale, 'Узница', 'Узник')] умоляет ещё до касания, но острие уже впивается в плоть. Когда мучение начинается, слова рассыпаются на отрывистые звуки, а тело судорожно дёргается, пытаясь найти опору."
 advanced_torture_result_judas_cradle_03_desc:0 "Колыбель Иуды наказывает медлительностью. [advanced_torture_prisoner.GetShortUIName] чувствует, как каждый вершок отпущенной верёвки ухудшает участь. Тело опускается всё ниже, острие проникает глубже, разрывая нежную плоть. Камера наполняется напряжением, стонами и краткими приказами, пока жертва больше не может отличить боль, стыд и ужас."

 advanced_torture_result_pear_of_anguish_01_desc:0 "Грушу страданий показывают [advanced_torture_prisoner.GetShortUIName] до применения, потому что часть мучения — в понимании. Инструмент собран, механизм действует, и [Select_CString(advanced_torture_prisoner.IsFemale, 'узница', 'узник')] теряет самообладание. Это не пытка грубой силы — это пытка вторжения, контроля и абсолютного страха."
 advanced_torture_result_pear_of_anguish_02_desc:0 "[advanced_torture_prisoner.GetShortUIName] пытается сопротивляться, когда тюремщики приближают инструмент, но цепи не оставляют возможности. Пытка продвигается маленькими механическими движениями, каждое хуже предыдущего. Когда она кончается, молчание [Select_CString(advanced_torture_prisoner.IsFemale, 'узницу', 'узника')] кажется глубже любого крика."
 advanced_torture_result_pear_of_anguish_03_desc:0 "Инструмент открывается по команде, медленно, с почти церемониальной жестокостью. [advanced_torture_prisoner.GetShortUIName] перестаёт проклинать и начинает умолять, когда понимает, что боль приходит не от удара, а от внутреннего и неизбежного давления."

 advanced_torture_result_iron_spider_01_desc:0 "Железного паука раскаляют добела, пока железо не начинает светиться багровым. Когда он впивается в [advanced_torture_prisoner.GetShortUIName], наказание приходит как жжение, разрывание и нечеловеческая боль. Раскалённые зубья плавят кожу, входят в плоть, и даже самые стойкие стражи отводят взгляды."
 advanced_torture_result_iron_spider_02_desc:0 "[advanced_torture_prisoner.GetShortUIName] отступает, насколько позволяют цепи, но паук неумолимо приближается. Его шипы уже раскалены, и когда они касаются тела, раздаётся шипение палимой плоти. Но истинный ужас — в паузе перед касанием, когда жертва знает, что будет дальше, и ничего не может сделать."
 advanced_torture_result_iron_spider_03_desc:0 "Металлические лапы паука оставляют на теле [advanced_torture_prisoner.GetShortUIName] кровавые, обгоревшие следы. Инструмент кусает, отступает и возвращается, вырывая куски мяса. Когда всё кончается, камера пахнет палёным мясом, страхом и навеки выжженным послушанием."

 advanced_torture_result_torture_chair_01_desc:0 "Стул с гвоздями принимает [advanced_torture_prisoner.GetShortUIName], не нуждаясь в движении. Достаточно заставить [Select_CString(advanced_torture_prisoner.IsFemale, 'узницу', 'узника')] сесть, затянуть ремни — и острия впиваются в плоть. Каждая попытка облегчить боль лишь вгоняет гвозди глубже, находя новые живые места. Вес тела делает остальное: мышцы рвутся, кровь стекает по деревянным ножкам, а любое движение превращается в новую рану."
 advanced_torture_result_torture_chair_02_desc:0 "Стражи толкают [advanced_torture_prisoner.GetShortUIName] на стул и с силой затягивают ремни. Гвозди входят в ягодицы, спину, бёдра. Мучение не нарастает — оно остаётся постоянным, как удары сердца. [Select_CString(advanced_torture_prisoner.IsFemale, 'Узница', 'Узник')] не может найти ни позы, ни отдыха, ни надежды — только острую боль, которая с каждым вздохом напоминает, что тело распято на собственных костях. Кровь капает на каменный пол, отсчитывая время, превращённое в пытку."
 advanced_torture_result_torture_chair_03_desc:0 "Стул терпеливо ждёт свою жертву. [advanced_torture_prisoner.GetShortUIName] понимает: пытать будут не ударами, а длительностью. Острия гвоздей уже разодрали кожу; теперь каждое биение сердца проталкивает их глубже в мышцы. Ремни не дают пошевелиться, и каждый вдох напоминает, что даже сидение стало бесконечным мучением. Из-под ремней сочится кровь, смешанная с потом, а сознание начинает мутиться от боли, но конца не видно."

 advanced_torture_result_skull_crusher_01_desc:0 "Давилку для черепа устанавливают с ужасающей точностью. [advanced_torture_prisoner.GetShortUIName] пытается отдёрнуться, но железо уже смыкается вокруг висков. Винт поворачивают медленно — и вот уже трещат височные кости, из глаз текут слёзы, смешанные с кровью. Каждый оборот приносит давление, словно весь мир сжимается в одной точке за глазами, готовой лопнуть."
 advanced_torture_result_skull_crusher_02_desc:0 "Вы приказываете не скорость — вы приказываете контроль. Тюремщики поворачивают механизм, пока [advanced_torture_prisoner.GetShortUIName] теряет способность бросать вызов, потом оскорблять, потом связно говорить. Давление ломает кости лица, челюсть смещается, из носа течёт кровь. Храбрость превращается в панику, а паника — в скулящую, едва узнаваемую мольбу, похожую на звериный скулёж."
 advanced_torture_result_skull_crusher_03_desc:0 "Инструмент кажется слишком простым, чтобы вызывать такой страх: железо и винт. [advanced_torture_prisoner.GetShortUIName] вскоре понимает, что большего и не нужно. Каждый поворот сжимает череп, боль концентрируется за глазами, дробятся скулы, хруст костей слышен в тишине камеры. Когда всё кончается, из ушей и носа жертвы сочится сукровица, а в глазах уже нет жизни — только остекленевшая пустота. Никто в комнате не путает это молчание с сопротивлением."