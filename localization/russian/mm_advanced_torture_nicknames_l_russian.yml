l_russian:
 advanced_torture.2001.t:0 "Палач"
 advanced_torture.2001.desc:0 "Слухи расползаются по коридорам, дворам и залам. Те, кто говорит о вас, упоминают уже не только ваши титулы. Теперь они шепчут другое имя со страхом: Палач."
 advanced_torture.2001.a:0 "Пусть шепчут его в страхе."

 advanced_torture.2002.t:0 "Похититель глаз"
 advanced_torture.2002.desc:0 "Говорят, ваши враги отводят взгляд ещё до того, как увидят вас. Глаза, отнятые по вашему приказу, стали достаточным предупреждением."
 advanced_torture.2002.a:0 "Смотреть на меня будет привилегией."

 advanced_torture.2003.t:0 "Костолом"
 advanced_torture.2003.desc:0 "Не все ваши узники умирают, но многие отмечены болями, которые никогда не проходят до конца. Из этих историй родилось имя: Костолом."
 advanced_torture.2003.a:0 "Кости помнят."

 advanced_torture.2004.t:0 "Лицерез"
 advanced_torture.2004.desc:0 "Лица, изуродованные по вашей воле, не нуждаются в словах. Любой, кто увидит эти шрамы, сразу поймёт, чья рука стояла за приказом."
 advanced_torture.2004.a:0 "Красоту тоже можно наказать."

 advanced_torture.2005.t:0 "Кромсатель"
 advanced_torture.2005.desc:0 "Некоторые наказания не кончаются, когда закрывается дверь камеры. Ваши жертвы несут ваш приговор в каждом движении, каждом падении и каждом взгляде, полном ужаса."
 advanced_torture.2005.a:0 "Милосердие оставляет слишком много тел нетронутыми."

 advanced_torture.2006.t:0 "Ослепитель"
 advanced_torture.2006.desc:0 "Те, кто говорит о вас, помнят потухшие глаза ваших врагов. Некоторые говорят, что вы предпочитаете отнимать зрение, а не жизнь, чтобы страх длился дольше."
 advanced_torture.2006.a:0 "Им не нужно видеть, чтобы подчиняться."

 advanced_torture.2007.t:0 "Терпеливый мучитель"
 advanced_torture.2007.desc:0 "Вы не всегда прибегаете к жесточайшему удару. Иногда достаточно ожидания, холода, неудобства и уверенности, что боль придёт, когда вы решите."
 advanced_torture.2007.a:0 "Терпение тоже может причинять боль."

 advanced_torture.2008.t:0 "Алый дознаватель"
 advanced_torture.2008.desc:0 "Тайны начинают всплывать в вашей тени. Одни боятся того, что вы делаете с телом; другие — того, что можете вырвать из души."
 advanced_torture.2008.a:0 "У каждой правды есть цена."

 advanced_torture.2009.t:0 "Кровавая рука"
 advanced_torture.2009.desc:0 "Ваша репутация — больше не отдельные слухи. Везде, где обсуждают ваше правосудие, кто-то вспоминает кровь, железо и руку, которая никогда не дрожит."
 advanced_torture.2009.a:0 "Чистые руки не годятся для власти."

 advanced_torture.2010.t:0 "Ломатель лжи"
 advanced_torture.2010.desc:0 "Тайны не выживают долго в ваших темницах. Под вашим взглядом ложь трескается, и правда в конце концов выползает на свет."
 advanced_torture.2010.a:0 "Правда всегда находит выход."

 advanced_torture.2011.t:0 "Мясник темниц"
 advanced_torture.2011.desc:0 "У темниц есть свой язык: цепи, сырой камень, медленные шаги и крики, которые слишком долго не смолкают. На этом языке ваше имя означает бойню."
 advanced_torture.2011.a:0 "Мои камеры учат послушанию."

