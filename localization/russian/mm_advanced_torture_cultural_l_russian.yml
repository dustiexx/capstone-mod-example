 advanced_torture.cultural.drakkar_stocks: "Драккара колодки"
 advanced_torture.scene.cultural.drakkar_stocks.t: "Драккара колодки"
 advanced_torture.scene.cultural.drakkar_stocks.desc: "Для [advanced_torture_prisoner.GetTitledFirstName] готовят драккара колодки. Это не казнь, а культурно окрашенная пытка: каждое орудие раскладывают с холодной тщательностью, превращая давление, боль и публичное унижение в наказание, которое все присутствующие узнают как часть определённой традиции."
 advanced_torture_result_cultural_drakkar_stocks_01_desc: "Драккара колодки оставляет [advanced_torture_prisoner.GetTitledFirstName] дрожащим, с достоинством, сломленным методом, который свидетели узнают как принадлежащий его народу."
 advanced_torture_result_cultural_drakkar_stocks_02_desc: "Когда драккара колодки заканчивается, тишина в покоях становится тяжелее самих ран. [advanced_torture_prisoner.GetTitledFirstName] понимает, что боль тоже может говорить языком культуры."
 advanced_torture_result_cultural_drakkar_stocks_03_desc: "Орудия, использованные для драккара колодки, убирают с нарочитым спокойствием. Следы остаются, дыхание сбивается, а унижение оказывается тщательно обрядовым."
