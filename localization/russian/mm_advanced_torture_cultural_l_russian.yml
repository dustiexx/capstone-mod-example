 advanced_torture.scene.cultural.peat_stocks.desc: "Для [advanced_torture_prisoner.GetTitledFirstName] готовят торфяные колодки. Это не казнь, а культурно окрашенная пытка: каждое орудие раскладывают с холодной тщательностью, превращая давление, боль и публичное унижение в наказание, которое все присутствующие узнают как часть определённой традиции."
 advanced_torture_result_cultural_peat_stocks_01_desc: "Торфяные колодки оставляет [advanced_torture_prisoner.GetTitledFirstName] дрожащим, с достоинством, сломленным методом, который свидетели узнают как принадлежащий его народу."
 advanced_torture_result_cultural_peat_stocks_02_desc: "Когда торфяные колодки заканчивается, тишина в покоях становится тяжелее самих ран. [advanced_torture_prisoner.GetTitledFirstName] понимает, что боль тоже может говорить языком культуры."
 advanced_torture_result_cultural_peat_stocks_03_desc: "Орудия, использованные для торфяные колодки, убирают с нарочитым спокойствием. Следы остаются, дыхание сбивается, а унижение оказывается тщательно обрядовым."
