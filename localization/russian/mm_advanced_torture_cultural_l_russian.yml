 advanced_torture_result_cultural_braided_coconut_rope_03_desc: "Орудия, использованные для плетёная кокосовая верёвка, убирают с нарочитым спокойствием. Следы остаются, дыхание сбивается, а унижение оказывается тщательно обрядовым."
