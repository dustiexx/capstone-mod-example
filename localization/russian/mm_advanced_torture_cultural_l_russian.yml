 advanced_torture_result_cultural_caucasian_monastery_stone_01_desc: "Кавказского монастыря камень оставляет [advanced_torture_prisoner.GetTitledFirstName] дрожащим, с достоинством, сломленным методом, который свидетели узнают как принадлежащий его народу."
 advanced_torture_result_cultural_caucasian_monastery_stone_02_desc: "Когда кавказского монастыря камень заканчивается, тишина в покоях становится тяжелее самих ран. [advanced_torture_prisoner.GetTitledFirstName] понимает, что боль тоже может говорить языком культуры."
 advanced_torture_result_cultural_caucasian_monastery_stone_03_desc: "Орудия, использованные для кавказского монастыря камень, убирают с нарочитым спокойствием. Следы остаются, дыхание сбивается, а унижение оказывается тщательно обрядовым."
