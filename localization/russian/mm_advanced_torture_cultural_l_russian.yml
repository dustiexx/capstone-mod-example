 advanced_torture.scene.cultural.euphrates_reed_needles.desc: "Для [advanced_torture_prisoner.GetTitledFirstName] готовят евфрата тростниковые иглы. Это не казнь, а культурно окрашенная пытка: каждое орудие раскладывают с холодной тщательностью, превращая давление, боль и публичное унижение в наказание, которое все присутствующие узнают как часть определённой традиции."
 advanced_torture_result_cultural_euphrates_reed_needles_01_desc: "Евфрата тростниковые иглы оставляет [advanced_torture_prisoner.GetTitledFirstName] дрожащим, с достоинством, сломленным методом, который свидетели узнают как принадлежащий его народу."
 advanced_torture_result_cultural_euphrates_reed_needles_02_desc: "Когда евфрата тростниковые иглы заканчивается, тишина в покоях становится тяжелее самих ран. [advanced_torture_prisoner.GetTitledFirstName] понимает, что боль тоже может говорить языком культуры."
 advanced_torture_result_cultural_euphrates_reed_needles_03_desc: "Орудия, использованные для евфрата тростниковые иглы, убирают с нарочитым спокойствием. Следы остаются, дыхание сбивается, а унижение оказывается тщательно обрядовым."
