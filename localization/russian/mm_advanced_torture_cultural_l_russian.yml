 advanced_torture.scene.cultural.samurai_oath_gag.t: "Самурайской клятвы кляп"
 advanced_torture.scene.cultural.samurai_oath_gag.desc: "Для [advanced_torture_prisoner.GetTitledFirstName] готовят самурайской клятвы кляп. Это не казнь, а культурно окрашенная пытка: каждое орудие раскладывают с холодной тщательностью, превращая давление, боль и публичное унижение в наказание, которое все присутствующие узнают как часть определённой традиции."
 advanced_torture_result_cultural_samurai_oath_gag_01_desc: "Самурайской клятвы кляп оставляет [advanced_torture_prisoner.GetTitledFirstName] дрожащим, с достоинством, сломленным методом, который свидетели узнают как принадлежащий его народу."
 advanced_torture_result_cultural_samurai_oath_gag_02_desc: "Когда самурайской клятвы кляп заканчивается, тишина в покоях становится тяжелее самих ран. [advanced_torture_prisoner.GetTitledFirstName] понимает, что боль тоже может говорить языком культуры."
 advanced_torture_result_cultural_samurai_oath_gag_03_desc: "Орудия, использованные для самурайской клятвы кляп, убирают с нарочитым спокойствием. Следы остаются, дыхание сбивается, а унижение оказывается тщательно обрядовым."
