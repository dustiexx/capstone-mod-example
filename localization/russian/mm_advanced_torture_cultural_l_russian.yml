 advanced_torture_result_cultural_calligraphy_ring_01_desc: "Каллиграфии кольцо оставляет [advanced_torture_prisoner.GetTitledFirstName] дрожащим, с достоинством, сломленным методом, который свидетели узнают как принадлежащий его народу."
 advanced_torture_result_cultural_calligraphy_ring_02_desc: "Когда каллиграфии кольцо заканчивается, тишина в покоях становится тяжелее самих ран. [advanced_torture_prisoner.GetTitledFirstName] понимает, что боль тоже может говорить языком культуры."
 advanced_torture_result_cultural_calligraphy_ring_03_desc: "Орудия, использованные для каллиграфии кольцо, убирают с нарочитым спокойствием. Следы остаются, дыхание сбивается, а унижение оказывается тщательно обрядовым."
