 advanced_torture.scene.cultural.ispan_bench.desc: "Для [advanced_torture_prisoner.GetTitledFirstName] готовят ишпана скамья. Это не казнь, а культурно окрашенная пытка: каждое орудие раскладывают с холодной тщательностью, превращая давление, боль и публичное унижение в наказание, которое все присутствующие узнают как часть определённой традиции."
 advanced_torture_result_cultural_ispan_bench_01_desc: "Ишпана скамья оставляет [advanced_torture_prisoner.GetTitledFirstName] дрожащим, с достоинством, сломленным методом, который свидетели узнают как принадлежащий его народу."
 advanced_torture_result_cultural_ispan_bench_02_desc: "Когда ишпана скамья заканчивается, тишина в покоях становится тяжелее самих ран. [advanced_torture_prisoner.GetTitledFirstName] понимает, что боль тоже может говорить языком культуры."
 advanced_torture_result_cultural_ispan_bench_03_desc: "Орудия, использованные для ишпана скамья, убирают с нарочитым спокойствием. Следы остаются, дыхание сбивается, а унижение оказывается тщательно обрядовым."
