l_russian:
 advanced_torture.5500.t:0 "Удовольствие от жестокости"
 advanced_torture.5500.desc:0 "Поначалу каждое мучение было лишь инструментом: ключом к тайнам, предупреждением врагам, методом внушить послушание. Но что-то изменилось. Когда начинаются крики, вы уже не отводите взгляд. Когда отдаёте приказ, вы уже не чувствуете прежней тяжести. Где-то в тёмных углах вашей души жестокость перестала быть средством и стала удовлетворением."
 advanced_torture.5500.a:0 "У страха других странный привкус..."