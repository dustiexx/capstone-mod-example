l_french:
 advanced_torture.2001.t:0 "Le Tortionnaire"
 advanced_torture.2001.desc:0 "Vous avez appris à transformer la douleur en obéissance. Les cachots murmurent déjà un nouveau nom à votre passage."
 advanced_torture.2001.a:0 "Qu’ils parlent ce nom à voix basse."
 advanced_torture.2002.t:0 "Le Preneur d’yeux"
 advanced_torture.2002.desc:0 "Plus d’un prisonnier a perdu la vue sur votre ordre. Désormais, certains détournent le regard avant même que vous ne parliez."
 advanced_torture.2002.a:0 "Qu’ils apprennent à craindre mon regard."
 advanced_torture.2003.t:0 "Le Briseur d’os"
 advanced_torture.2003.desc:0 "Le craquement des os est devenu une sorte de signature. Vos ennemis savent que votre patience peut durer plus longtemps que leur corps."
 advanced_torture.2003.a:0 "Les os se souviennent."
 advanced_torture.2004.t:0 "Le Défigureur"
 advanced_torture.2004.desc:0 "Des visages autrefois nobles portent désormais vos avertissements. Chaque cicatrice raconte à la cour ce que coûte votre colère."
 advanced_torture.2004.a:0 "Qu’ils portent mon message sur leur peau."
 advanced_torture.2005.t:0 "Le Mutileur"
 advanced_torture.2005.desc:0 "Des membres perdus, des corps brisés et des survivants tremblants composent votre réputation. La pitié n’y a guère de place."
 advanced_torture.2005.a:0 "Un corps peut encore servir d’exemple."
 advanced_torture.2006.t:0 "L’Aveugleur"
 advanced_torture.2006.desc:0 "La lumière a quitté les yeux de ceux qui vous ont défié. Dans l’obscurité qu’ils portent désormais, votre nom demeure."
 advanced_torture.2006.a:0 "Ils verront moins, mais se souviendront davantage."
 advanced_torture.2007.t:0 "Le Tourmenteur patient"
 advanced_torture.2007.desc:0 "Vous ne vous précipitez pas. Vous laissez la peur mûrir, les forces s’épuiser et les volontés se fissurer lentement."
 advanced_torture.2007.a:0 "La patience est aussi un instrument."
 advanced_torture.2008.t:0 "L’Inquisiteur cramoisi"
 advanced_torture.2008.desc:0 "Vos questions ne restent jamais sans réponse très longtemps. Le sang et la peur savent ouvrir les silences les mieux gardés."
 advanced_torture.2008.a:0 "La vérité a un prix."
 advanced_torture.2009.t:0 "La Main rouge"
 advanced_torture.2009.desc:0 "Votre main est devenue un symbole de châtiment. Là où elle se pose, la peur suit bientôt."
 advanced_torture.2009.a:0 "Une main suffit."
 advanced_torture.2010.t:0 "Le Briseur de vérité"
 advanced_torture.2010.desc:0 "Vous ne cherchez pas seulement des secrets : vous brisez la résistance qui les protège. Même les mensonges tremblent devant vous."
 advanced_torture.2010.a:0 "Tout finit par céder."
 advanced_torture.2011.t:0 "Le Boucher des cellules"
 advanced_torture.2011.desc:0 "Les cachots ont leur langue : chaînes, pierre humide, pas lents et cris qui tardent à mourir. Dans cette langue, votre nom signifie boucherie."
 advanced_torture.2011.a:0 "Mes cellules enseignent l’obéissance."
