 advanced_torture_result_rats_03_desc:0 "Lorsque le supplice s’achève, [advanced_torture_prisoner.GetShortUIName] n’est plus tout à fait le même. La pierre garde l’écho de sa souffrance, et le corps porte ce que la bouche n’ose plus dire."
 advanced_torture_result_enucleation_01_desc:0 "Les instruments se rapprochent du visage de [advanced_torture_prisoner.GetShortUIName], et nul dans la cellule ne confond plus menace et ordre. Quand l’œil est arraché, la douleur laisse place à une mutilation impossible à cacher."
 advanced_torture_result_enucleation_02_desc:0 "[advanced_torture_prisoner.GetShortUIName] est maintenu immobile tandis que les geôliers travaillent avec une lenteur cruelle. Un cri bref, puis le monde devient plus sombre pour toujours."
 advanced_torture_result_enucleation_03_desc:0 "Votre ordre est exécuté sans cérémonie. [advanced_torture_prisoner.GetShortUIName] survivra peut-être, mais chaque regard perdu rappellera qui l’a condamné."
 advanced_torture_result_leg_amputation_01_desc:0 "Les sangles tiennent [advanced_torture_prisoner.GetShortUIName] pendant que les instruments descendent. La jambe est sacrifiée au châtiment, et le cachot se remplit de sang, de fer et de peur."
 advanced_torture_result_leg_amputation_02_desc:0 "Il n’y a plus de menace, seulement une décision. Quand les geôliers ont fini, [advanced_torture_prisoner.GetShortUIName] comprend que la douleur passera plus vite que l’absence."
 advanced_torture_result_leg_amputation_03_desc:0 "La mutilation est accomplie. [advanced_torture_prisoner.GetShortUIName] respire encore, mais son corps porte désormais une frontière définitive entre avant et après."
 advanced_torture_result_nail_cleaner_01_desc:0 "Dans la pénombre du cachot, [advanced_torture_prisoner.GetShortUIName] subit les stylets sous les ongles. Les geôliers travaillent avec une précision froide, laissant la douleur monter assez lentement pour que chaque instant soit compris et redouté."
 advanced_torture_result_nail_cleaner_02_desc:0 "On ne cherche pas seulement à blesser [advanced_torture_prisoner.GetShortUIName], mais à inscrire l’obéissance dans sa mémoire. Les stylets sous les ongles transforme les cris en silences brisés, et les silences en aveux possibles."
 advanced_torture_result_nail_cleaner_03_desc:0 "Lorsque le supplice s’achève, [advanced_torture_prisoner.GetShortUIName] n’est plus tout à fait le même. La pierre garde l’écho de sa souffrance, et le corps porte ce que la bouche n’ose plus dire."
 advanced_torture_result_phalaris_bull_01_desc:0 "Le bronze avale [advanced_torture_prisoner.GetShortUIName] et les brasiers s’éveillent autour du taureau. La chaleur transforme le métal en jugement, et les cris qui en sortent semblent appartenir à une bête."
 advanced_torture_result_phalaris_bull_02_desc:0 "Lorsque la porte de bronze se referme, la cellule retient son souffle. Puis le feu parle, lentement, jusqu’à ce que [advanced_torture_prisoner.GetShortUIName] ne soit plus qu’une voix enfermée dans le métal."
 advanced_torture_result_phalaris_bull_03_desc:0 "Le taureau de Phalaris ne se contente pas de brûler : il donne une forme à la terreur. [advanced_torture_prisoner.GetShortUIName] disparaît dans la chaleur, et le cachot écoute."
