 advanced_torture_result_torture_chair_03_desc:0 "Lorsque le supplice s’achève, [advanced_torture_prisoner.GetShortUIName] n’est plus tout à fait le même. La pierre garde l’écho de sa souffrance, et le corps porte ce que la bouche n’ose plus dire."
 advanced_torture_result_skull_crusher_01_desc:0 "L’écrase-crâne est posé avec une précision terrible autour de la tête de [advanced_torture_prisoner.GetShortUIName]. Le mécanisme tourne lentement, et chaque tour semble rapprocher le monde d’un seul point de douleur."
 advanced_torture_result_skull_crusher_02_desc:0 "Les geôliers ne se hâtent pas. La pression monte, efface l’insulte, puis la parole, puis presque la conscience de [advanced_torture_prisoner.GetShortUIName]."
 advanced_torture_result_skull_crusher_03_desc:0 "Fer, vis et patience suffisent. [advanced_torture_prisoner.GetShortUIName] découvre que la tête peut contenir plus de peur que de pensées."
