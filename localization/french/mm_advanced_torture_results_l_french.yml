l_french:
 advanced_torture.1001.t:0 "La torture prend fin"
 advanced_torture.1001.desc:0 "Le supplice est terminé. [advanced_torture_prisoner.GetShortUIName] se tait enfin, affaibli par la douleur et marqué par la peur."
 advanced_torture.1001.a:0 "Que cette leçon soit retenue."
 advanced_torture.1002.t:0 "La marque est faite"
 advanced_torture.1002.desc:0 "Le fer a laissé son signe. [advanced_torture_prisoner.GetShortUIName] portera la marque de votre châtiment longtemps après que la douleur se sera estompée."
 advanced_torture.1002.a:0 "Une marque parle plus fort que mille menaces."
 advanced_torture.1004.t:0 "Un œil arraché"
 advanced_torture.1004.desc:0 "[advanced_torture_prisoner.GetShortUIName] a perdu un œil sur votre ordre. La douleur passera, mais la mutilation restera."
 advanced_torture.1004.a:0 "Qu’il voie moins, mais se souvienne davantage."
 advanced_torture.1007.t:0 "Le corps est brisé"
 advanced_torture.1007.desc:0 "La torture a laissé [advanced_torture_prisoner.GetShortUIName] avec un corps brisé et une volonté affaiblie."
 advanced_torture.1007.a:0 "Le corps obéit aussi."
 advanced_torture.1008.t:0 "La torture finit par la mort"
 advanced_torture.1008.desc:0 "Le corps de [advanced_torture_prisoner.GetShortUIName] n’a pas résisté au supplice. Entre les blessures, l’épuisement et la peur, la vie s’échappe avant que quiconque puisse l’arrêter."
 advanced_torture.1008.a:0 "Ainsi finit sa résistance."
 advanced_torture_result_simple_whipping_01_desc:0 "Dans la pénombre du cachot, [advanced_torture_prisoner.GetShortUIName] subit les coups de fouet. Les geôliers travaillent avec une précision froide, laissant la douleur monter assez lentement pour que chaque instant soit compris et redouté."
 advanced_torture_result_simple_whipping_02_desc:0 "On ne cherche pas seulement à blesser [advanced_torture_prisoner.GetShortUIName], mais à inscrire l’obéissance dans sa mémoire. Les coups de fouet transforme les cris en silences brisés, et les silences en aveux possibles."
 advanced_torture_result_simple_whipping_03_desc:0 "Lorsque le supplice s’achève, [advanced_torture_prisoner.GetShortUIName] n’est plus tout à fait le même. La pierre garde l’écho de sa souffrance, et le corps porte ce que la bouche n’ose plus dire."
