 advanced_torture_result_torture_chair_01_desc:0 "Dans la pénombre du cachot, [advanced_torture_prisoner.GetShortUIName] subit la chaise de torture. Les geôliers travaillent avec une précision froide, laissant la douleur monter assez lentement pour que chaque instant soit compris et redouté."
