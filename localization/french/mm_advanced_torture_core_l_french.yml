l_french:
 advanced_torture_interaction:0 "Torture avancée"
 advanced_torture_interaction_desc:0 "Soumettre [recipient.GetShortUINameNoTooltip] à un supplice choisi depuis le menu de torture avancée."
 advanced_torture_cooldown:0 "Torturé récemment"
 advanced_torture_cooldown_desc:0 "Ce personnage a été torturé récemment et ne peut pas subir une nouvelle séance de torture avancée pour le moment."
 advanced_torture_recently_tortured:0 "Torturé récemment"
 advanced_torture_recently_tortured_desc:0 "Ce personnage a subi une torture récente. La douleur, la peur et les blessures pèsent encore sur son corps et son esprit."
 advanced_torture_recovery_minor:0 "Convalescence après un supplice léger"
 advanced_torture_recovery_minor_desc:0 "Ce personnage se remet d’un tourment mineur. Les marques sont visibles, mais les dégâts ne semblent pas irréversibles."
 advanced_torture_recovery_medium:0 "Convalescence après une torture modérée"
 advanced_torture_recovery_medium_desc:0 "Ce personnage se remet d’une torture sérieuse. Le corps reste affaibli, et l’esprit se souvient encore de l’épreuve."
 advanced_torture_recovery_severe:0 "Convalescence après une torture sévère"
 advanced_torture_recovery_severe_desc:0 "Ce personnage porte les conséquences d’une torture brutale. Les plaies, la peur et l’humiliation ont laissé une marque profonde."
 advanced_torture_tortured_me_opinion:0 "M’a torturé"
 advanced_torture_tortured_family_member_opinion:0 "A torturé un membre de ma famille"
 advanced_torture_house_relation_torture_minor_desc:0 "Torture légère infligée à un membre de la maison"
 advanced_torture_house_relation_torture_medium_desc:0 "Torture infligée à un membre de la maison"
 advanced_torture_house_relation_torture_severe_desc:0 "Torture sévère infligée à un membre de la maison"
 advanced_torture.menu.back:0 "Retour"
 advanced_torture_unique_slot_01:0 "Tortures de dragon"
 advanced_torture_unique_slot_02:0 "Tortures culturelles"
 advanced_torture_unique_slot_03:0 "Tortures de maison"
 advanced_torture_unique_slot_04:0 "Emplacement unique vide"
 advanced_torture_unique_slot_05:0 "Emplacement unique vide"
 advanced_torture_light_torture_tt:0 "Une torture légère. Elle inflige des blessures mineures, de l’humiliation et de la rancœur, mais laisse rarement des séquelles permanentes."
 advanced_torture_medium_torture_tt:0 "Une torture modérée. Elle peut causer des blessures, une détérioration physique, une peur durable et de meilleures chances d’arracher des secrets."
 advanced_torture_strong_torture_tt:0 "Une torture sévère. Elle peut laisser des séquelles graves, des mutilations, des maladies, des dommages mentaux, voire une mort accidentelle."
 advanced_torture_sadistic_torture_tt:0 "Une torture sadique. Seuls ceux d’une cruauté exceptionnelle peuvent ordonner ces supplices sans hésitation."
 advanced_torture_enucleation_tt:0 "Arracher l’un des yeux du prisonnier. Impossible contre les personnages déjà aveugles."
 advanced_torture_leg_amputation_tt:0 "Amputer l’une des jambes du prisonnier. Impossible contre les personnages qui ont déjà perdu une jambe."
 advanced_torture_tortured_to_survive:0 "Torturé pour survivre"
 advanced_torture_tortured_to_survive_desc:0 "Ce prisonnier est maintenu au bord de la mort par un tortionnaire expert, non par pitié, mais pour prolonger le supplice."
