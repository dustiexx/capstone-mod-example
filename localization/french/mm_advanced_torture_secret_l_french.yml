 advanced_torture.3001.t:0 "Un secret révélé"
 advanced_torture.3001.desc:0 "Entre des respirations brisées et des mots à peine audibles, [advanced_torture_secret_bearer.GetShortUIName] a révélé quelque chose qu’il n’aurait jamais confessé volontairement. La torture a ouvert une fissure dans son silence."
