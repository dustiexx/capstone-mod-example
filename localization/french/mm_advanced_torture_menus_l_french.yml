l_french:
 advanced_torture.0001.t:0 "Torture avancée"
 advanced_torture.0001.desc:0 "[advanced_torture_prisoner.GetShortUIName] est à votre merci. La cellule est froide, humide et silencieuse, seulement troublée par le bruit des chaînes et la respiration tremblante du prisonnier. Vous pouvez ordonner un châtiment léger, recourir à des méthodes plus dures, commencer une torture prolongée ou ouvrir la porte aux tourments réservés aux âmes les plus impitoyables."
 advanced_torture.0001.light:0 "Tortures légères"
 advanced_torture.0001.medium:0 "Tortures modérées"
 advanced_torture.0001.strong:0 "Tortures sévères"
 advanced_torture.0001.long_tortures:0 "Tortures prolongées"
 advanced_torture.0001.unique:0 "Tortures uniques"
 advanced_torture.0001.cancel:0 "Cela n’en vaut pas la peine"
 advanced_torture.0002.t:0 "Tortures légères"
 advanced_torture.0002.desc:0 "Toutes les tortures ne cherchent pas à détruire le corps. Certaines suffisent à humilier, marquer ou briser la dignité du prisonnier sans transformer la cellule en abattoir."
 advanced_torture.0002.simple_whipping:0 "Coups de fouet"
 advanced_torture.0002.branding_iron:0 "Fer rouge"
 advanced_torture.0002.stocks:0 "Ceps de pieds"
 advanced_torture.0002.walk_of_shame:0 "Marche de la honte"
 advanced_torture.0003.t:0 "Tortures modérées"
 advanced_torture.0003.desc:0 "Ces méthodes ne sont plus de simples punitions. Elles sont conçues pour briser la résistance, arracher des aveux et graver dans la mémoire du prisonnier la douleur que votre autorité peut infliger."
 advanced_torture.0003.bastinado:0 "Bastonnade / Falaka"
 advanced_torture.0003.water_torment:0 "Supplice de l’eau / Toca"
 advanced_torture.0003.compression_cords:0 "Cordes de compression"
 advanced_torture.0003.strappado:0 "Estrapade"
 advanced_torture.0003.thumbscrew:0 "Broyeur de pouces"
 advanced_torture.0003.short_stretching_bench:0 "Banc d’étirement court"
 advanced_torture.0004.t:0 "Tortures sévères"
 advanced_torture.0004.desc:0 "Ici s’arrêtent les avertissements et commencent les blessures durables. Ces supplices laissent des corps brisés, des membres inutiles, des yeux perdus et des souvenirs qu’aucun médecin ne peut effacer."
 advanced_torture.0004.rack:0 "Le chevalet"
 advanced_torture.0004.wedged_boot:0 "Botte à coins"
 advanced_torture.0004.rats:0 "Supplice des rats"
 advanced_torture.0004.enucleation:0 "Énucléation d’un œil"
 advanced_torture.0004.leg_amputation:0 "Amputation de jambe"
 advanced_torture.0004.nail_cleaner:0 "Cure-ongles / Stylets"
 advanced_torture.0005.t:0 "Tortures uniques"
 advanced_torture.0005.desc:0 "Certains tourments n’appartiennent à aucune catégorie ordinaire. Ils relèvent de cultures particulières, de traditions obscures, de compatibilités spéciales ou de ceux qui ont déjà franchi les limites de la cruauté commune."
 advanced_torture.0005.sadistic:0 "Tortures sadiques"
 advanced_torture.0005.cultural:0 "Tortures culturelles"
 advanced_torture.0006.t:0 "Tortures sadiques"
 advanced_torture.0006.desc:0 "Ces méthodes ne sont pas seulement des punitions. Ce sont des démonstrations de cruauté froide, réservées à ceux qui trouvent dans la souffrance une forme de satisfaction."
 advanced_torture.0006.phalaris_bull:0 "Taureau de Phalaris"
 advanced_torture.0006.judas_cradle:0 "Berceau de Judas"
 advanced_torture.0006.pear_of_anguish:0 "Poire d’angoisse"
 advanced_torture.0006.iron_spider:0 "Araignée de fer"
 advanced_torture.0006.torture_chair:0 "Chaise de torture"
 advanced_torture.0006.skull_crusher:0 "Écrase-crâne"
 advanced_torture.0007.t:0 "Tortures culturelles"
 advanced_torture.0007.desc:0 "Cette section est réservée aux supplices propres à certaines cultures et traditions. Elle pourra être complétée plus tard sans toucher au cœur du système."
 advanced_torture.0007.empty:0 "Aucune torture culturelle n’est disponible pour l’instant."
