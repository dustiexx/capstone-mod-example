 advanced_torture.cultural.drakkar_stocks: "Drakkar Cep"
 advanced_torture.scene.cultural.drakkar_stocks.t: "Drakkar Cep"
 advanced_torture.scene.cultural.drakkar_stocks.desc: "On prépare drakkar Cep pour [advanced_torture_prisoner.GetTitledFirstName]. Ce n’est pas une exécution, mais une torture marquée par sa culture : chaque instrument est disposé avec un soin calculé, transformant la pression, la douleur et l’humiliation publique en un châtiment que tous les témoins rattachent à une tradition précise."
 advanced_torture_result_cultural_drakkar_stocks_01_desc: "Drakkar Cep laisse [advanced_torture_prisoner.GetTitledFirstName] tremblant, la dignité brisée par une méthode que les témoins reconnaissent comme propre à son peuple."
 advanced_torture_result_cultural_drakkar_stocks_02_desc: "Quand drakkar Cep prend fin, le silence de la chambre pèse autant que les blessures. [advanced_torture_prisoner.GetTitledFirstName] comprend que la douleur peut parler la langue d’une culture."
 advanced_torture_result_cultural_drakkar_stocks_03_desc: "Les instruments de drakkar Cep sont retirés avec un calme délibéré. Les marques restent, le souffle vacille, et l’humiliation a été soigneusement ritualisée."
