 advanced_torture_result_cultural_tatami_rope_03_desc: "Les instruments de tatami Corde sont retirés avec un calme délibéré. Les marques restent, le souffle vacille, et l’humiliation a été soigneusement ritualisée."
 advanced_torture.cultural.samurai_oath_gag: "Samouraï Serment Bâillon"
 advanced_torture.scene.cultural.samurai_oath_gag.t: "Samouraï Serment Bâillon"
 advanced_torture.scene.cultural.samurai_oath_gag.desc: "On prépare samouraï Serment Bâillon pour [advanced_torture_prisoner.GetTitledFirstName]. Ce n’est pas une exécution, mais une torture marquée par sa culture : chaque instrument est disposé avec un soin calculé, transformant la pression, la douleur et l’humiliation publique en un châtiment que tous les témoins rattachent à une tradition précise."
