 advanced_torture.scene.cultural.disloyal_vassal_bench.desc: "On prépare déloyal Vassal Banc pour [advanced_torture_prisoner.GetTitledFirstName]. Ce n’est pas une exécution, mais une torture marquée par sa culture : chaque instrument est disposé avec un soin calculé, transformant la pression, la douleur et l’humiliation publique en un châtiment que tous les témoins rattachent à une tradition précise."
 advanced_torture_result_cultural_disloyal_vassal_bench_01_desc: "Déloyal Vassal Banc laisse [advanced_torture_prisoner.GetTitledFirstName] tremblant, la dignité brisée par une méthode que les témoins reconnaissent comme propre à son peuple."
 advanced_torture_result_cultural_disloyal_vassal_bench_02_desc: "Quand déloyal Vassal Banc prend fin, le silence de la chambre pèse autant que les blessures. [advanced_torture_prisoner.GetTitledFirstName] comprend que la douleur peut parler la langue d’une culture."
 advanced_torture_result_cultural_disloyal_vassal_bench_03_desc: "Les instruments de déloyal Vassal Banc sont retirés avec un calme délibéré. Les marques restent, le souffle vacille, et l’humiliation a été soigneusement ritualisée."
