 advanced_torture_result_cultural_monsoon_ring_02_desc: "Quand mousson Anneau prend fin, le silence de la chambre pèse autant que les blessures. [advanced_torture_prisoner.GetTitledFirstName] comprend que la douleur peut parler la langue d’une culture."
 advanced_torture_result_cultural_monsoon_ring_03_desc: "Les instruments de mousson Anneau sont retirés avec un calme délibéré. Les marques restent, le souffle vacille, et l’humiliation a été soigneusement ritualisée."
