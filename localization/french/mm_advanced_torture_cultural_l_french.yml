 advanced_torture_result_cultural_birch_ring_01_desc: "Bouleau Anneau laisse [advanced_torture_prisoner.GetTitledFirstName] tremblant, la dignité brisée par une méthode que les témoins reconnaissent comme propre à son peuple."
 advanced_torture_result_cultural_birch_ring_02_desc: "Quand bouleau Anneau prend fin, le silence de la chambre pèse autant que les blessures. [advanced_torture_prisoner.GetTitledFirstName] comprend que la douleur peut parler la langue d’une culture."
 advanced_torture_result_cultural_birch_ring_03_desc: "Les instruments de bouleau Anneau sont retirés avec un calme délibéré. Les marques restent, le souffle vacille, et l’humiliation a été soigneusement ritualisée."
