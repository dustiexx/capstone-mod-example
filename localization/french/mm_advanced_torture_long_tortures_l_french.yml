l_french:
 advanced_torture_long_sleep_3_tt:0 "Vous commencerez trois jours de privation de sommeil. Le prisonnier sera épuisé et pourrait céder avant la fin."
 advanced_torture_long_sleep_5_tt:0 "Vous commencerez cinq jours de privation de sommeil. Le risque d’atteinte mentale et physique sera plus grand."
 advanced_torture_long_sleep_7_tt:0 "Vous commencerez sept jours de privation de sommeil. Les conséquences pourront être sévères, et la mort n’est plus impossible."
 advanced_torture_long_sleep_10_tt:0 "Vous commencerez dix jours de privation de sommeil. Le prisonnier risque de se briser entièrement, ou de ne pas survivre."
 advanced_torture_long_dark_cell_15_tt:0 "Vous enfermerez le prisonnier quinze jours dans une cellule obscure. L’isolement peut briser son esprit."
 advanced_torture_long_dark_cell_30_tt:0 "Vous enfermerez le prisonnier trente jours dans une cellule obscure. L’isolement peut faire naître des supplications ou des aveux."
 advanced_torture_long_dark_cell_60_tt:0 "Vous enfermerez le prisonnier soixante jours dans une cellule obscure. Le dommage mental sera très élevé."
 advanced_torture_long_dark_cell_90_tt:0 "Vous enfermerez le prisonnier quatre-vingt-dix jours dans une cellule obscure. L’obscurité peut le laisser malade, confus et irrémédiablement marqué."
 advanced_torture_long_starvation_5_tt:0 "Vous priverez le prisonnier de nourriture et d’eau suffisantes pendant cinq jours. Son corps commencera à faiblir."
 advanced_torture_long_starvation_15_tt:0 "Vous priverez le prisonnier de nourriture et d’eau suffisantes pendant quinze jours. La faim peut briser le corps et la volonté."
 advanced_torture_long_starvation_30_tt:0 "Vous priverez le prisonnier de nourriture et d’eau suffisantes pendant trente jours. Les conséquences peuvent devenir permanentes."
 advanced_torture_long_starvation_50_tt:0 "Vous priverez le prisonnier de nourriture et d’eau suffisantes pendant cinquante jours. Sa survie sera incertaine et le dommage extrême."
 advanced_torture_long_suspension_1_tt:0 "Vous suspendrez le prisonnier pendant un jour. La douleur sera intense, mais encore contrôlée."
 advanced_torture_long_suspension_3_tt:0 "Vous suspendrez le prisonnier pendant trois jours. Ses membres commenceront à céder."
 advanced_torture_long_suspension_5_tt:0 "Vous suspendrez le prisonnier pendant cinq jours. Les dégâts physiques pourront être sévères."
 advanced_torture_long_suspension_7_tt:0 "Vous suspendrez le prisonnier pendant sept jours. Cette torture peut le laisser ruiné."
 advanced_torture.6001.t:0 "Tortures prolongées"
 advanced_torture.6001.desc:0 "Tous les tourments ne finissent pas en une seule séance. Certains exigent des jours d’enfermement, d’attente, d’épuisement et de peur. Le prisonnier subira non seulement la douleur du moment, mais aussi l’incertitude de ne pas savoir quand elle cessera."
 advanced_torture.6001.sleep_deprivation:0 "Privation de sommeil"
 advanced_torture.6001.dark_cell:0 "Cellule obscure"
 advanced_torture.6001.starvation:0 "Faim et soif"
 advanced_torture.6001.prolonged_suspension:0 "Suspension prolongée"
 advanced_torture.6002.t:0 "Privation de sommeil"
 advanced_torture.6002.desc:0 "La privation de sommeil n’a besoin ni de lames ni de brasiers. La lumière, le bruit, les questions, les pas dans l’obscurité et les mains qui réveillent le prisonnier dès que son corps tente de céder suffisent. Choisissez combien de temps durera la veille."
 advanced_torture.6002.three_days:0 "Trois jours"
 advanced_torture.6002.five_days:0 "Cinq jours"
 advanced_torture.6002.seven_days:0 "Sept jours"
 advanced_torture.6002.ten_days:0 "Dix jours"
 advanced_torture.6003.t:0 "Cellule obscure"
 advanced_torture.6003.desc:0 "La cellule obscure ne punit pas d’un seul coup. Elle punit par l’absence : pas de lumière, pas de voix claires, aucune certitude du passage des jours. À l’intérieur, même un petit silence peut sonner comme une menace."
 advanced_torture.6003.fifteen_days:0 "Quinze jours"
 advanced_torture.6003.thirty_days:0 "Trente jours"
 advanced_torture.6003.sixty_days:0 "Soixante jours"
 advanced_torture.6003.ninety_days:0 "Quatre-vingt-dix jours"
 advanced_torture.6004.t:0 "Faim et soif"
 advanced_torture.6004.desc:0 "La faim ne hurle pas au début. Elle s’installe lentement, serre le ventre, assèche la bouche et transforme chaque odeur, chaque cruche d’eau et chaque plateau retiré en promesse cruelle."
 advanced_torture.6004.five_days:0 "Cinq jours"
 advanced_torture.6004.fifteen_days:0 "Quinze jours"
 advanced_torture.6004.thirty_days:0 "Trente jours"
 advanced_torture.6004.fifty_days:0 "Cinquante jours"
 advanced_torture.6005.t:0 "Suspension prolongée"
 advanced_torture.6005.desc:0 "Les cordes se tendent jusqu’à ce que les pieds touchent à peine le sol, ou le quittent entièrement. D’abord le corps souffre. Puis viennent les épaules, le souffle, les nerfs, l’attente et la certitude que nul ne le descendra sans votre ordre."
 advanced_torture.6005.one_day:0 "Un jour"
 advanced_torture.6005.three_days:0 "Trois jours"
 advanced_torture.6005.five_days:0 "Cinq jours"
 advanced_torture.6005.seven_days:0 "Sept jours"
 advanced_torture.6201.t:0 "L’insomnie prend fin"
 advanced_torture.6201.desc:0 "Après des jours sans véritable repos, [advanced_torture_prisoner.GetShortUIName] parvient à peine à tenir son regard droit. Ses réponses arrivent tard, ses mains tremblent, et chaque clignement semble une défaite. Le corps vit encore, mais l’esprit a été traîné au bord de la rupture."
 advanced_torture.6201.a:0 "Qu’il dorme, s’il le peut encore."
 advanced_torture.6202.t:0 "La cellule s’ouvre"
 advanced_torture.6202.desc:0 "Lorsque la porte s’ouvre enfin, [advanced_torture_prisoner.GetShortUIName] sort des ténèbres affaibli de corps et usé de volonté. La lumière blesse ses yeux comme une accusation, et un instant il semble incapable de distinguer liberté, punition et rêve."
 advanced_torture.6202.a:0 "L’obscurité enseigne l’obéissance."
 advanced_torture.6203.t:0 "Faim et soif"
 advanced_torture.6203.desc:0 "Les jours de privation ont réduit [advanced_torture_prisoner.GetShortUIName] à une ombre épuisée. La faim et la soif n’ont pas laissé de marques nettes, mais elles ont laissé une faiblesse qui ne sera pas facilement oubliée."
 advanced_torture.6203.a:0 "Le besoin peut aussi être une chaîne."
 advanced_torture.6204.t:0 "La suspension prend fin"
 advanced_torture.6204.desc:0 "La suspension prolongée a pris fin. [advanced_torture_prisoner.GetShortUIName] s’effondre avec un corps abîmé, des membres tremblants et une expression qui n’a pas besoin de mots."
 advanced_torture.6204.a:0 "Qu’il se souvienne de chaque instant."
 advanced_torture.6301.t:0 "Brisé par l’éveil"
 advanced_torture.6301.desc:0 "[advanced_torture_prisoner.GetShortUIName] ne sait plus s’il parle à vous, à ses geôliers ou aux ombres qui bougent sur les murs. Entre phrases absurdes et supplications brisées, des noms, des peurs et des demi-vérités s’échappent. Il peut encore endurer, mais quelque chose s’est déjà rompu en lui."
 advanced_torture.6301.release:0 "Mettre fin à la veille"
 advanced_torture.6301.continue:0 "Laisser continuer"
 advanced_torture.6301.extend:0 "Ajouter du temps à la veille"
 advanced_torture.6302.t:0 "Voix dans l’obscurité"
 advanced_torture.6302.desc:0 "Dans la cellule obscure, [advanced_torture_prisoner.GetShortUIName] a commencé à parler à des personnes qui ne sont pas là. Quand la porte s’ouvre, les mots sortent pêle-mêle : prières, aveux, fragments de secrets, accusations contre le silence lui-même. L’isolement a fait son œuvre."
 advanced_torture.6302.release:0 "Ouvrir la cellule"
 advanced_torture.6302.continue:0 "Refermer la porte"
 advanced_torture.6302.extend:0 "Prolonger l’isolement"
 advanced_torture.6303.t:0 "La faim parle"
 advanced_torture.6303.desc:0 "[advanced_torture_prisoner.GetShortUIName] tremble à la vue d’une simple écuelle. Les lèvres craquelées cherchent des mots avant la fierté, et la faim pousse la vérité à travers la gorge asséchée. Le corps supplie avant même que l’esprit ne cède."
 advanced_torture.6303.release:0 "Lui donner de quoi survivre"
 advanced_torture.6303.continue:0 "Laisser la faim parler"
 advanced_torture.6303.extend:0 "Prolonger la privation"
 advanced_torture.6304.t:0 "Les membres cèdent"
 advanced_torture.6304.desc:0 "La suspension a transformé le temps en une blessure continue. [advanced_torture_prisoner.GetShortUIName] ne crie plus avec force ; il gémit, tremble et perd le compte des heures. Chaque corde semble avoir appris le langage de la douleur."
 advanced_torture.6304.release:0 "Le faire descendre"
 advanced_torture.6304.continue:0 "Le laisser suspendu"
 advanced_torture.6304.extend:0 "Prolonger la suspension"
 advanced_torture.6401.t:0 "La veille commence"
 advanced_torture.6401.desc:0 "Les geôliers reçoivent l’ordre de ne pas laisser [advanced_torture_prisoner.GetShortUIName] fermer l’œil. Des torches resteront allumées, des pas résonneront dans le couloir, et chaque fois que le corps cherchera le sommeil, une main rude le ramènera à l’éveil."
 advanced_torture.6401.a:0 "Qu’il n’ait aucun repos."
 advanced_torture.6402.t:0 "La cellule obscure"
 advanced_torture.6402.desc:0 "[advanced_torture_prisoner.GetShortUIName] est conduit au-delà des couloirs fréquentés, jusqu’à une pièce où la lumière semble mourir avant d’atteindre le sol. La porte se referme. Derrière elle, le temps n’a plus de forme."
 advanced_torture.6402.a:0 "Que l’obscurité fasse son œuvre."
 advanced_torture.6403.t:0 "Le jeûne forcé"
 advanced_torture.6403.desc:0 "Les gardes reçoivent l’ordre de contrôler chaque ration, chaque gorgée, chaque plateau retiré. [advanced_torture_prisoner.GetShortUIName] ne mourra pas tout de suite ; la faim apprendra d’abord à compter les heures à sa place."
 advanced_torture.6403.a:0 "Que le besoin le dresse."
 advanced_torture.6404.t:0 "La suspension commence"
 advanced_torture.6404.desc:0 "Les cordes sont nouées, les poignets serrés, et [advanced_torture_prisoner.GetShortUIName] est hissé jusqu’à ce que son propre poids devienne l’instrument de torture. Les geôliers n’auront qu’à attendre."
 advanced_torture.6404.a:0 "Qu’il reste là-haut."
