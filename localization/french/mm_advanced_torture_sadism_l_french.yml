 advanced_torture.5500.t:0 "Le plaisir de la cruauté"
 advanced_torture.5500.desc:0 "Au début, chaque supplice n’était qu’un outil : une clef pour ouvrir les secrets, un avertissement aux ennemis, une méthode pour imposer l’obéissance. Mais quelque chose a changé. Quand les cris commencent, vous ne détournez plus le regard. Quand vous donnez l’ordre, vous ne ressentez plus le même poids. Dans quelque recoin sombre de votre âme, la cruauté a cessé d’être un moyen pour devenir une satisfaction."
 advanced_torture.5500.a:0 "La peur des autres a un goût étrange..."
